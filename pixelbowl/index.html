        const wi = P[i].r.pow, wj = P[j].r.pow, tot = wi + wj || 1;
        P[i].x = clamp(P[i].x - dx / d * push * (2 * wj / tot), 0, FIELD.W);
        P[i].y = clamp(P[i].y - dy / d * push * (2 * wj / tot), 0, FIELD.L);
        P[j].x = clamp(P[j].x + dx / d * push * (2 * wi / tot), 0, FIELD.W);
        P[j].y = clamp(P[j].y + dy / d * push * (2 * wi / tot), 0, FIELD.L);
      }
    }
  }

  function engagements(dt) {
    for (const p of P) {
      if (p.eng < 0) continue;
      const q = P[p.eng];
      if (!q || dist(p.x, p.y, q.x, q.y) > CFG.disengageR || q.mot === "down") { disengage(p); continue; }
      if (p.side !== "off") continue;          // resolve each pair once
      const edge = q.r.pow - p.r.blk;
      q.shed += Math.max(0.05, CFG.shedRate + edge * CFG.shedRating) * dt;
      if (q.shed >= 1) {
        disengage(p);
        q.immune = CFG.shedImmune; q.shed = 0;
        p.mot = "stumble"; p.timer = 0.4;
      }
    }
  }

  function ballStep(dt) {
    const b = S.ball;
    if (b.state === "held") {
      const c = P[b.who];
      b.x = c.x; b.y = c.y; b.h = 0;
      return;
    }
    if (b.state === "air") {
      b.tt += dt;
      const t = clamp(b.tt / b.dur, 0, 1);
      b.x = lerp(b.fx, b.tx, t);
      b.y = lerp(b.fy, b.ty, t);
      b.h = b.apex * 4 * t * (1 - t);
      if (b.tt >= b.dur) arrive();
      return;
    }
    if (b.state === "loose") {
      b.x = clamp(b.x + b.vx * dt, 0, FIELD.W);
      b.y = clamp(b.y + b.vy * dt, 0, FIELD.L);
      b.vx *= Math.max(0, 1 - 3.2 * dt); b.vy *= Math.max(0, 1 - 3.2 * dt);
      b.timer -= dt;
      let win = null, wd = 0.9;
      for (const p of P) {
        if (p.mot === "down") continue;
        const d = dist(p.x, p.y, b.x, b.y);
        if (d < wd) { wd = d; win = p; }
      }
      if (win) {
        const mine = attacking(win);
        win.hasBall = true;
        S.ball = { state: "held", who: win.id, x: win.x, y: win.y, h: 0 };
        if (mine) end("fumble-own", win.x, win.y, "FUMBLE · RECOVERED");
        else {
          S.turnover = true; S.shake = 0.4;
          S.graceUntil = S.t + CFG.turnoverGrace;
          flipJobs(win);
        }
        return;
      }
      if (b.timer <= 0 || b.x <= 0.2 || b.x >= FIELD.W - 0.2)
        end("fumble-own", b.x, b.y, "FUMBLE · BALL DEAD");
    }
  }

  function contact() {
    const c = carrier();
    if (!c || c.mot === "down") return;
    if (S.t < S.graceUntil) return;      // securing it
    for (const p of P) {
      if (p === c || attacking(p) || p.mot === "down") continue;
      // A blocked defender still occupies space. He cannot chase, but a runner
      // who comes straight at him can still be dragged down — without this the
      // offence carves a perfectly clean lane on every snap.
      const blocked = p.eng >= 0;
      const reach = blocked ? CFG.tackleR * CFG.blockedReach : CFG.tackleR;
      if (dist(p.x, p.y, c.x, c.y) > reach) continue;
      tackleTry(p, c, blocked ? CFG.blockedTackle : 1);
      if (S.over || c.mot === "down") return;
    }
  }

  function bounds() {
    if (S.over) return;
    const c = carrier();
    if (!c || c.mot === "down") return;
    const crossed = S.turnover ? c.y <= FIELD.ownGoal : c.y >= FIELD.oppGoal;
    if (crossed) {
      Sound.score();
      return end(S.turnover ? (S.passAttempted && !S.completed ? "int-td" : "fumble-td") : "td",
                 c.x, c.y, S.turnover ? "PICK SIX" : "TOUCHDOWN!");
    }
    if (c.x <= 0.15 || c.x >= FIELD.W - 0.15) {
      c.mot = "down";
      if (S.turnover) return end(S.passAttempted && !S.completed ? "int" : "fumble", c.x, c.y, "OUT OF BOUNDS");
      // A quarterback who runs out of bounds behind his own line is sacked, not
      // credited with a rush for minus nine — which is what this used to do, and
      // it was most of the negative rushing yards in a game with no run calls.
      if (c.idx === 0 && play.kind === "pass" && !S.threw && c.y < S.los)
        return end("sack", c.x, c.y, "SACKED FOR " + Math.round(S.los - c.y));
      return end("oob", c.x, c.y, "OUT AT " + gainLine(c.y - S.los).toLowerCase().toUpperCase());
    }
  }

  // ----- the loop ------------------------------------------------------
  S.tucked = false;
  S.user = -1;

  // ----- after the whistle ---------------------------------------------
  // A whistle is not a pause button. Everyone still on his feet coasts to a
  // stop over about a third of a second, blocks let go, and nobody is left
  // sprinting on the spot through the replay of a play that is over.
  function settle(dt) {
    const k = Math.pow(0.004, dt);
    for (const p of P) {
      want[p.id].x = 0; want[p.id].y = 0;
      if (p.mot === "down") { p.vx = p.vy = 0; continue; }
      if (p.mot === "engaged" || p.mot === "stumble") { p.mot = "run"; p.eng = -1; p.timer = 0; }
      p.vx *= k; p.vy *= k;
      if (Math.hypot(p.vx, p.vy) < 0.3) { p.vx = 0; p.vy = 0; continue; }
      p.x = clamp(p.x + p.vx * dt, 0.4, FIELD.W - 0.4);
      p.y += p.vy * dt;
    }
  }
  S.settle = settle;

  S.step = (dt, input) => {
    if (S.over) return settle(dt);
    if (!S.snapped) { if (input.snap) S.snap(); return; }
    S.t += dt;
    S.shake = Math.max(0, S.shake - dt * 2.2);

    if (S.handoffAt >= 0 && !S.handoffDone && S.t >= S.handoffAt) {
      S.handoffDone = true;
      const rb = P.find(p => p.job.t === "carry");
      if (rb && S.ball.state === "held" && S.ball.who === 0) {
        P[0].hasBall = false; rb.hasBall = true;
        S.ball = { state: "held", who: rb.id, x: rb.x, y: rb.y, h: 0 };
      }
    }

    if (input.tuck && S.qbHasIt()) S.tucked = true;
    // Hold it too long and he pulls it down on his own — but never out from
    // under a thumb that is mid-drag and about to throw.
    if (!S.tucked && !input.aiming && S.qbHasIt() && S.t > play.develop + 3.2) S.tucked = true;
    if (S.windup >= 0) { S.windup -= dt; if (S.windup <= 0) release(); }
    else if (input.throwTo) S.throwTo(input.throwTo.x, input.throwTo.y);

    drive(dt, input);
    integrate(dt);
    engagements(dt);
    ballStep(dt);
    contact();
    bounds();

    if (!S.over && S.t > CFG.maxPlay) {
      const c = carrier();
      end("gain", c ? c.x : S.ball.x, c ? c.y : S.los, "WHISTLE");
    }
  };

  return S;
}

/* ===================================================================
   THE GAME — rules, drives, and the phase machine.

   One coordinate frame for everything: you attack toward y = 110, they
   attack toward y = 10. Nothing mirrors, so "the ball is on the 35"
   means the same thing to the renderer, the rules and the drive sim.
   =================================================================== */
const H_STEP = 1 / 60;          // the one true simulation tick
const G = {
  st: null,
  acc: 0,                       // leftover time between simulation ticks
  play: null,          // live PlaySimulation
  banner: null,
  bannerT: 0,
};

function newGame(myAb, oppAb, opts = {}) {
  const seed = (Date.now() ^ (Math.random() * 0xffffffff)) >>> 0;
  RNG = makeRNG(seed);
  const my = teamBy(myAb), opp = teamBy(oppAb);
  const qs = SETTINGS.quarter * 60;
  const first = RNG.chance(0.5) ? "us" : "them";

  G.st = {
    seed,
    my, opp,
    // In a season your offence is the eleven you have been coaching; the rest
    // of the field is generated as usual. `makeRoster` shapes both sides, and
    // only the offence half of yours is ever put on the grass.
    myRoster: opts.myRoster || makeRoster(my, seed ^ 0x5f3a),
    oppRoster: makeRoster(opp, seed ^ 0x9c17),
    season: !!opts.season,
    // What their offence is up against. In an exhibition that is your club's
    // nominal strength; in a season it is the DEFENCE grade you have coached.
    defStr: opts.defStr != null ? opts.defStr : my.str,
    q: 1, clock: qs, quarterLen: qs,
    us: 0, them: 0,
    poss: first,
    down: 1, toGo: 10, los: 35, lineToGain: 45, ballX: FIELD.midY,
    phase: "coin",
    scheme: SCHEMES[0], chosen: null, audibles: [],
    tryFor: null,          // 'us' while your extra point is pending
    kick: null,            // live kick state
    drive: null,           // opponent drive ticker
    stats: {
      us:   { plays: 0, yards: 0, first: 0, pass: 0, rush: 0, td: 0, to: 0, comp: 0, att: 0,
              drives: 0, startSum: 0 },
      them: { plays: 0, yards: 0, first: 0, pass: 0, rush: 0, td: 0, to: 0, comp: 0, att: 0,
              drives: 0, startSum: 0 },
    },
    longestTD: 0,
    pstat: {},                   // season only: what each of your men did
    dstat: { stops: 0, takeaways: 0 },
    tend: { run: 0, pass: 0 },   // what you have been calling lately
    log: [],
  };
  // Whoever wins the toss starts at their own 25.
  if (first === "us") giveUs(FIELD.ownGoal + 25);
  else startTheirDrive(FIELD.oppGoal - 25);
  say(first === "us" ? "YOU RECEIVE" : (G.st.opp.ab + " RECEIVE"), 1.3);
  return G.st;
}

function say(text, secs = 1.4, tone = "flood") {
  G.banner = { text, tone };
  G.bannerT = secs;
  G.bannerFor = secs;
}

/* ---- spotting ---------------------------------------------------- */
function giveUs(y) {
  const s = G.st;
  // A new possession, not a fresh set of downs. Where your drives begin is the
  // single most useful number for telling a good offence from a short field,
  // and there was no way to see it from inside the game.
  if (s.poss !== "us" && s.tryFor !== "us2") {
    const st = s.stats.us;
    st.drives++;
    st.startSum += FIELD.oppGoal - clamp(y, FIELD.ownGoal + 0.5, FIELD.oppGoal - 0.5);
  }
  s.poss = "us";
  s.los = clamp(y, FIELD.ownGoal + 0.5, FIELD.oppGoal - 0.5);
  s.down = 1;
  const toGoal = FIELD.oppGoal - s.los;
  if (toGoal <= 10) { s.lineToGain = FIELD.oppGoal; s.toGo = toGoal; }
  else { s.lineToGain = s.los + 10; s.toGo = 10; }
  s.ballX = FIELD.midY;
  s.phase = "playcall";
  s.chosen = null;
}

function fieldLabel(y, forUs) {
  const toGoal = forUs ? FIELD.oppGoal - y : y - FIELD.ownGoal;
  if (toGoal <= 0) return "GOAL";
  if (toGoal >= 100) return "OWN GOAL";
  const n = toGoal > 50 ? Math.round(100 - toGoal) : Math.round(toGoal);
  if (n === 50) return "MIDFIELD";
  return (toGoal > 50 ? "OWN " : "OPP ") + n;
}

function downText() {
  const s = G.st;
  const ord = ["", "1ST", "2ND", "3RD", "4TH"][clamp(s.down, 0, 4)];
  if (s.lineToGain >= FIELD.oppGoal - 0.01 && s.poss === "us") return ord + " & GOAL";
  if (s.toGo < 1) return ord + " & INCHES";
  return ord + " & " + Math.round(s.toGo);
}

const fgDistance = () => (FIELD.oppGoal - G.st.los) + 17;
const inFGRange = () => fgDistance() <= 58;

/* ---- clock ------------------------------------------------------- */
// The clock used to sit still through a snap and then jump by the whole
// length of the play the instant the whistle went. It runs live now; the
// quarter is only allowed to actually END between plays, the way it does in
// the real thing — you always get to finish the down you are in.
function burnLive(seconds) {
  const s = G.st;
  s.clock = Math.max(0, s.clock - seconds);
}

function burn(seconds) {
  const s = G.st;
  s.clock -= seconds;
  if (s.clock > 0) return false;
  s.clock = 0;
  return true;
}

function endOfQuarter() {
  const s = G.st;
  if (s.q >= 4) { finishGame(); return true; }
  s.q++;
  s.clock = s.quarterLen;
  say("END OF QUARTER", 1.5);
  Sound.horn();
  return false;
}

function finishGame() {
  const s = G.st;
  s.phase = "final";
  Sound.horn();
  RECORD.played++;
  if (s.us > s.them) RECORD.won++;
  else if (s.us < s.them) RECORD.lost++;
  else RECORD.tied++;
  RECORD.best = Math.max(RECORD.best, s.us);
  RECORD.longestTD = Math.max(RECORD.longestTD, s.longestTD);
  saveRecord();
  if (s.season && inSeason()) finishSeasonGame(s);
}

/* ---- the season, after the whistle ------------------------------- */
function finishSeasonGame(s) {
  const rng = makeRNG((Date.now() ^ (s.seed >>> 3)) >>> 0);
  const growth = [];
  const R = LEAGUE.roster;

  // Turn the afternoon into experience, and experience into rating points.
  for (const key in s.pstat) {
    const i = +key;
    const man = i === 7 ? R.k : R.off[i];
    awardXP(man, s.pstat[key].xp, growth);
  }
  // Your defence is graded on stops, and it moves slowly — one number should
  // not swing a season on one good afternoon.
  const dGain = s.dstat.stops * 0.9 + s.dstat.takeaways * 2.2;
  LEAGUE.defXP = (LEAGUE.defXP || 0) + dGain;
  while (LEAGUE.defXP >= 22 && LEAGUE.def < 95) {
    LEAGUE.defXP -= 22; LEAGUE.def++;
    growth.push({ unit: "DEFENCE", stat: "grade", by: 1 });
  }

  const won = s.us > s.them, tied = s.us === s.them;
  LEAGUE.lastGrowth = {
    us: s.us, them: s.them, opp: s.opp.ab, won, tied,
    week: LEAGUE.phase === "playoffs" ? "PLAYOFF" : "WEEK " + (LEAGUE.week + 1),
    growth: growth.slice(0, 8),
    stats: Object.keys(s.pstat).map(k => ({ i: +k, line: s.pstat[k] })),
  };

  if (LEAGUE.phase === "playoffs") {
    const tie = (LEAGUE.bracket || []).find(g => !g.done && (g.a === LEAGUE.my || g.b === LEAGUE.my));
    if (tie) {
      const meFirst = tie.a === LEAGUE.my;
      tie.sa = meFirst ? s.us : s.them;
      tie.sb = meFirst ? s.them : s.us;
      tie.done = true;
      // A tie in a knockout goes to the higher seed, which is what a coin
      // toss is for in a game with no overtime.
      tie.winner = tie.sa === tie.sb ? tie.a : (tie.sa > tie.sb ? tie.a : tie.b);
    }
    advancePlayoffs(rng);
  } else {
    recordResult(LEAGUE.my, s.opp.ab, s.us, s.them);
    simOtherGames(rng);
    LEAGUE.log.push(`W${LEAGUE.week + 1} ${won ? "W" : tied ? "T" : "L"} ${s.us}-${s.them} ${s.opp.ab}`);
    (LEAGUE.results || (LEAGUE.results = []))[LEAGUE.week] =
      { opp: s.opp.ab, us: s.us, them: s.them };
    LEAGUE.week++;
    if (LEAGUE.week >= REG_WEEKS) startPlayoffs(rng);
  }
  saveLeague();
}

/* ---- the off-season ----------------------------------------------
   Everybody gets a year older, which is the only thing in this game
   that happens to you rather than because of you. Then one draft pick,
   because a season you cannot change anything about is a schedule, not
   a career.
   ------------------------------------------------------------------ */
function buildOffseason(rng) {
  const R = LEAGUE.roster, all = R.off.concat([R.k]);
  const aged = [], gone = [];

  for (const p of all) {
    p.age++; p.seasons++;
    const ovr = overallOf(p);
    const pool = GROWS[p.pos] || GROWS.QB;
    let delta = 0;
    if (p.age <= 24) delta = rng.int(1, 3);
    else if (p.age <= 28) delta = rng.int(0, 1);
    else if (p.age <= 31) delta = -rng.int(0, 1);
    else delta = -rng.int(1, 3);
    // Growth still respects the ceiling; decline does not respect anything.
    for (let i = 0; i < Math.abs(delta); i++) {
      const k = pool[(i + p.age) % pool.length];
      if (delta > 0) { if (overallOf(p) < p.pot) p.r[k] = Math.min(99, p.r[k] + 1); }
      else p.r[k] = Math.max(8, p.r[k] - 1);
    }
    // Ageing eats the ceiling too, so a thirty-three-year-old is finished
    // improving no matter how good he once looked.
    p.pot = Math.round(Math.max(overallOf(p), p.pot - (p.age > 29 ? 2 : 0)));
    const after = overallOf(p);
    const retires = p.age >= 38 || (p.age >= 33 && after < 55) || (p.age >= 35 && rng.chance(0.5));
    if (retires) gone.push(p); else aged.push({ p, was: ovr, now: after });
  }

  // Replace the retired at once. A roster with a hole in it is a roster that
  // every screen has to remember to check, and one of them will forget: the
  // hub crashed on exactly this in the seventh season of a test career. The
  // draft then upgrades a slot rather than filling a void.
  const holes = [];
  for (const p of gone) {
    const i = R.off.indexOf(p);
    if (i >= 0) { holes.push(ROSTER_POS[i]); R.off[i] = null; }
    else { holes.push("K"); R.k = null; }
  }
  fillHoles(rng);

  // The league moves around you: clubs drift a little every year so the
  // table is not the same table it was last season.
  // Records survive until the new season actually starts, so the off-season
  // and the table still have last year to show you.
  for (const ab in LEAGUE.clubs) {
    const c = LEAGUE.clubs[ab];
    c.str = clamp(c.str + rng.int(-2, 2), -6, 9);
  }

  // The draft is a league event, not a menu. Everybody picks, worst record
  // first, so winning the Pixel Bowl costs you the top of the board — which is
  // the only price the game asks you to pay for being good.
  const order = standings().slice().reverse().map(r => r.ab);
  const board = makeDraftClass(rng, all, DRAFT_PICKS + 4);
  void holes;
  return {
    year: LEAGUE.year,
    retired: gone.map(p => ({ n: p.first + " " + p.last, pos: p.pos, age: p.age })),
    aged: aged.filter(a => a.now !== a.was).slice(0, 8),
    order, board, at: 0, taken: [], done: false,
  };
}

const DRAFT_PICKS = 8;              // one round, one pick each

// A class with a gradient: the top of the board is genuinely better than the
// bottom, which is what makes a draft slot worth anything.
function makeDraftClass(rng, roster, n) {
  const used = new Set(roster.filter(Boolean).map(p => p.num));
  const seen = new Set();
  // Every position is represented, quarterbacks included — a class you cannot
  // find a passer in is not a class.
  const spread = ["QB", "WR", "RB", "OL", "TE", "WR", "QB", "OL", "RB", "TE", "K", "WR"];
  const out = [];
  for (let i = 0; i < n; i++) {
    const pos = spread[i % spread.length];
    const tier = 7 - Math.floor(i / 2) * 1.6 + rng.bell() * 2.5;
    let p;
    for (let k = 0; k < 12; k++) {
      p = makePerson(pos, tier, rng, used, rng.int(21, 23));
      if (!seen.has(p.first)) break;
    }
    seen.add(p.first);
    p.pot = Math.round(clamp(overallOf(p) + rng.int(8, 26), 55, 99));
    out.push(p);
  }
  // Ordered the way a scouting board is: by what he might become, not by what
  // he is on the day.
  return out.sort((a, b) => (b.pot * 2 + overallOf(b)) - (a.pot * 2 + overallOf(a)));
}

// What a club needs, so its pick reads as a decision rather than a dice roll.
function clubNeedScore(ab, p) {
  if (ab === LEAGUE.my) return 0;
  const c = LEAGUE.clubs[ab];
  // Other clubs have no roster to inspect, so they value ceiling, then the
  // player, then a nudge toward positions that matter most on this field.
  const weight = p.pos === "QB" ? 1.12 : p.pos === "WR" ? 1.06 : p.pos === "K" ? 0.7 : 1;
  return (p.pot * 1.6 + overallOf(p)) * weight + (c.str < 0 ? 6 : 0);
}

// Step the draft forward until it is your turn, or until it is over.
function runDraft() {
  const o = LEAGUE.offseason;
  if (!o || o.done) return;
  const rng = makeRNG((LEAGUE.year * 6151 + o.at * 97) >>> 0);
  while (o.at < DRAFT_PICKS) {
    const ab = o.order[o.at % o.order.length];
    if (ab === LEAGUE.my) return;                 // your board, your call
    const best = o.board
      .map((p, i) => ({ p, i, v: clubNeedScore(ab, p) + rng.bell() * 6 }))
      .sort((x, y) => y.v - x.v)[0];
    if (best) {
      o.board.splice(best.i, 1);
      o.taken.push({ ab, pos: best.p.pos, name: best.p.last, ovr: overallOf(best.p), pick: o.at + 1 });
      // A good pick makes them a little better next year.
      const c = LEAGUE.clubs[ab];
      c.str = clamp(c.str + (best.p.pot >= 90 ? 1 : 0), -6, 9);
    }
    o.at++;
  }
  o.done = true;
}

const myDraftSlot = () => {
  const o = LEAGUE.offseason;
  return o ? o.order.indexOf(LEAGUE.my) + 1 : 0;
};

// Anywhere still empty after the draft gets a replacement-level body, because
// you cannot take the field with six men.
function fillHoles(rng) {
  const R = LEAGUE.roster;
  const used = new Set(R.off.filter(Boolean).map(p => p.num).concat(R.k ? [R.k.num] : []));
  R.off.forEach((p, i) => {
    if (!p) R.off[i] = makePerson(ROSTER_POS[i], -3, rng, used, rng.int(22, 26));
  });
  if (!R.k) R.k = makePerson("K", -3, rng, used, rng.int(23, 30));
}

// Walking away is a real choice when nobody left on the board beats what you
// have. The pick is spent either way — you do not get to keep it.
function passOnDraft() {
  const o = LEAGUE.offseason;
  if (!o || o.done) return;
  o.taken.push({ ab: LEAGUE.my, pos: "-", name: "PASSED", ovr: 0, pick: o.at + 1 });
  o.at++;
  runDraft();
  saveLeague();
}

function signDraftPick(pick) {
  const R = LEAGUE.roster, o = LEAGUE.offseason;
  if (!o || o.done) return;
  const i = o.board.indexOf(pick);
  if (i >= 0) o.board.splice(i, 1);
  o.taken.push({ ab: LEAGUE.my, pos: pick.pos, name: pick.last, ovr: overallOf(pick), pick: o.at + 1 });
  o.at++;
  if (pick.pos === "K") { R.k = pick; }
  else {
    // He takes the job from whoever is worst at his position — which after a
    // retirement is the replacement-level body standing in for the man who left.
    const cands = R.off.map((p, i2) => ({ p, i2 })).filter(x => ROSTER_POS[x.i2] === pick.pos);
    if (cands.length) {
      cands.sort((a, b) => overallOf(a.p) - overallOf(b.p));
      R.off[cands[0].i2] = pick;
    }
  }
  runDraft();
  saveLeague();
}

function startNextSeason() {
  for (const ab in LEAGUE.clubs) {
    const c = LEAGUE.clubs[ab];
    c.w = 0; c.l = 0; c.t = 0; c.pf = 0; c.pa = 0;
  }
  LEAGUE.year++;
  LEAGUE.week = 0;
  LEAGUE.phase = "regular";
  LEAGUE.bracket = null;
  LEAGUE.champion = null;
  LEAGUE.offseason = null;
  LEAGUE.lastGrowth = null;
  LEAGUE.log = [];
  LEAGUE.schedule = makeSchedule(TEAMS.map(t => t.ab));
  saveLeague();
}

function startPlayoffs(rng) {
  const top = standings().slice(0, 4).map(r => r.ab);
  LEAGUE.phase = "playoffs";
  LEAGUE.bracket = [
    { round: "SEMI-FINAL", a: top[0], b: top[3], done: false },
    { round: "SEMI-FINAL", a: top[1], b: top[2], done: false },
  ];
  if (!top.includes(LEAGUE.my)) {
    // You did not make it. The league plays on without you, which stings more
    // than being told the season is over.
    for (const g of LEAGUE.bracket) simTie(g, rng);
    advancePlayoffs(rng);
  }
}

function simTie(g, rng) {
  g.sa = simScore(clubStr(g.a), clubStr(g.b), rng);
  g.sb = simScore(clubStr(g.b), clubStr(g.a), rng);
  if (g.sa === g.sb) g.sa += 3;
  g.winner = g.sa > g.sb ? g.a : g.b;
  g.done = true;
}

function advancePlayoffs(rng) {
  const B = LEAGUE.bracket;
  // Play out any tie you are not in.
  for (const g of B) if (!g.done && g.a !== LEAGUE.my && g.b !== LEAGUE.my) simTie(g, rng);
  if (B.every(g => g.done) && B.length === 2) {
    B.push({ round: "PIXEL BOWL", a: B[0].winner, b: B[1].winner, done: false });
    const f = B[2];
    if (f.a !== LEAGUE.my && f.b !== LEAGUE.my) simTie(f, rng);
  }
  const f = B[2];
  if (f && f.done) {
    LEAGUE.champion = f.winner;
    if (f.winner === LEAGUE.my) LEAGUE.title++;
    LEAGUE.phase = "offseason";
    LEAGUE.offseason = buildOffseason(rng);
    runDraft();                     // everyone above you picks before you see it
  }
}

/* ---- what each man did, this game ---------------------------------
   Only kept in a season. The play simulation stays ignorant of all of
   this: it reports who ended up with the ball and the rules translate
   that into a stat line and, eventually, into rating points.
   ------------------------------------------------------------------ */
function manLine(i) {
  const s = G.st;
  if (!s.pstat[i]) s.pstat[i] = { att: 0, comp: 0, yds: 0, td: 0, rec: 0, car: 0, brk: 0, made: 0, kicks: 0, xp: 0 };
  return s.pstat[i];
}

function credit(res) {
  const s = G.st;
  if (!s.season) return;
  const td = res.kind === "td" ? 1 : 0;
  const gain = Math.max(0, res.yards);

  if (res.pass) {
    const qb = manLine(0);
    qb.att++;
    if (res.complete) {
      qb.comp++; qb.yds += gain; qb.td += td;
      qb.xp += 5 + gain * 0.45 + td * 20;
      if (res.catcher >= 0) {
        const w = manLine(res.catcher);
        w.rec++; w.yds += gain; w.td += td; w.brk += res.breaks;
        w.xp += 8 + gain * 0.5 + td * 20 + res.breaks * 6;
      }
    }
    // The men up front are graded on the thing you can see: did he get to
    // throw it at all.
    if (!res.sacked) for (const i of [5, 6]) manLine(i).xp += 4;
  } else if (res.kind !== "sack" && res.by >= 0) {
    const b = manLine(res.by);
    b.car++; b.yds += gain; b.td += td; b.brk += res.breaks;
    b.xp += 6 + gain * 0.7 + td * 20 + res.breaks * 6;
    for (const i of [5, 6]) manLine(i).xp += 3;
  }
}

/* ---- applying your play ------------------------------------------ */
function applyResult(res) {
  const s = G.st, st = s.stats.us;
  st.plays++;
  credit(res);
  if (res.pass) { st.att++; if (res.complete) { st.comp++; st.pass += res.yards; } }
  else if (res.kind !== "sack") st.rush += res.yards;
  // Net yards. This used to floor every play at zero, so a nine-yard sack cost
  // nothing on the stat sheet and the total on the final screen flattered you.
  if (res.kind !== "incomplete") st.yards += res.yards;

  // Only the huddle is charged here — the play itself was billed second by
  // second while you were running it.
  const quarterOver = burn(CFG.huddle);

  switch (res.kind) {
    case "td": {
      s.us += 6; st.td++;
      s.longestTD = Math.max(s.longestTD, Math.round(res.yards));
      Sound.crowd();
      say("TOUCHDOWN", 1.6, "good");
      s.tryFor = "us";
      s.phase = "try";
      return;
    }
    case "safety":
      s.them += 2; st.to++;
      say("SAFETY", 1.6, "bad");
      startTheirDrive(FIELD.oppGoal - 35);
      break;
    case "int": case "fumble":
      st.to++;
      say(res.headline, 1.6, "bad");
      startTheirDrive(res.y);
      break;
    case "int-td": case "fumble-td":
      st.to++;
      s.them += 7;
      say("PICK SIX", 1.8, "bad");
      startTheirDrive(FIELD.oppGoal - 25, true);
      break;
    default: {
      // Ordinary down. An incompletion is the exception: the ball comes back
      // to the previous spot, it does not stay where it hit the grass — which
      // is what this used to do, quietly handing the offence free yards and
      // the occasional free first down.
      const incomplete = res.kind === "incomplete";
      const spot = incomplete ? s.los
                              : clamp(res.y, FIELD.ownGoal + 0.5, FIELD.oppGoal - 0.5);
      if (!incomplete) s.ballX = clamp(res.x, 4, FIELD.W - 4);
      if (spot >= s.lineToGain - 0.01) {
        st.first++;
        Sound.first();
        say("FIRST DOWN", 1.0, "flood");
        giveUs(spot);
        if (!incomplete) s.ballX = clamp(res.x, 4, FIELD.W - 4);
      } else if (s.down >= 4) {
        say("TURNOVER ON DOWNS", 1.6, "bad");
        startTheirDrive(spot);
      } else {
        s.down++;
        s.los = spot;
        s.toGo = s.lineToGain - spot;
        s.phase = "playcall";
        s.chosen = null;
      }
    }
  }
  if (quarterOver && s.phase !== "final" && s.phase !== "try") endOfQuarter();
}

/* ---- the extra point --------------------------------------------- */
function beginTry(twoPoint) {
  const s = G.st;
  if (twoPoint) {
    s.tryFor = "us2";
    giveUs(FIELD.oppGoal - 2);
    s.down = 1; s.toGo = 2; s.lineToGain = FIELD.oppGoal;
    s.phase = "playcall";
  } else {
    beginKick("xp");
  }
}

function finishTry(good, points) {
  const s = G.st;
  if (s.season && points === 1) { const k = manLine(7); k.kicks++; if (good) { k.made++; k.xp += 7; } }
  if (good) { s.us += points; say(points === 2 ? "TWO POINTS" : "EXTRA POINT GOOD", 1.3, "good"); }
  else say("NO GOOD", 1.3, "bad");
  s.tryFor = null;
  if (burn(6)) { if (endOfQuarter()) return; }
  startTheirDrive(FIELD.oppGoal - 25);
}

/* ---- kicking ------------------------------------------------------ */
function beginKick(kind) {
  const s = G.st;
  if (kind === "xp") { s.los = FIELD.oppGoal - 15; s.ballX = FIELD.midY; }
  const dist = kind === "xp" ? 32 : fgDistance();
  const spotY = s.los - 7, spotX = FIELD.midY;

  // The unit, so a kick looks like a snap rather than a slot machine.
  const players = [];
  for (const dx of [-5, -2.5, 0, 2.5, 5])
    players.push({ x: spotX + dx, y: s.los, side: "off", role: "line" });
  players.push({ x: spotX + 0.9, y: spotY, side: "off", role: "hold" });
  players.push({ x: spotX - 1.8, y: spotY - 2.4, side: "off", role: "kicker" });
  for (const dx of [-6, -3.5, -1, 1.5, 4, 6.5])
    players.push({ x: spotX + dx, y: s.los + 2.2, side: "def", role: "rush", y0: s.los + 2.2 });
  players.push({ x: spotX, y: s.los + 4.4, side: "def", role: "rush", y0: s.los + 4.4 });

  s.kick = {
    // Two stages, in the order they happen in the real thing: pick the power,
    // the ball is snapped, then find your line before the rush arrives.
    kind, dist, spotY, spotX, players, t: 0, stage: "power", aimT: 0,
    wind: RNG.range(-CFG.kickWindMax, CFG.kickWindMax),
    aimX: 0, power: 0, flight: null,
    range: scaled(s.myRoster.k.r.pow, CFG.kickRangeMin, CFG.kickRangeMax),
  };
  s.phase = "kick";
}

function resolveKick(aimX, power) {
  const s = G.st, k = s.kick;
  // Wind pushes the ball; a steadier kicker holds his line better.
  const steady = clamp(s.myRoster.k.r.awr / 99, 0.3, 1);
  const drift = k.wind * (k.dist / 40) * (1.7 - steady) * 1.6;
  // No hidden penalty for a big one. The bar says red or green and means it:
  // red is short of the posts, green gets there. Where it ends up between
  // them is your aim and the wind, which is the part you can actually read.
  const landX = aimX + drift;

  const hasLeg = k.dist <= k.range * (0.58 + 0.46 * power);
  const good = hasLeg && Math.abs(landX) <= FIELD.uprightHalf;
  k.flight = { t: 0, dur: 0.85, good, hasLeg, landX, power };
  Sound.kick();
  return good;
}

/* ---- the opponent's drive ----------------------------------------
   You never play defense, so their possession is simulated and read
   out a line at a time. It keeps a game to a handful of minutes and
   keeps the thumb on the half of the game you actually control.
   ------------------------------------------------------------------ */
function startTheirDrive(startY, afterTheirScore = false) {
  const s = G.st;
  s.poss = "them";
  s.phase = "defense";
  s.los = clamp(startY, FIELD.ownGoal + 1, FIELD.oppGoal - 1);
  s.down = 1; s.toGo = 10;
  s.lineToGain = Math.max(FIELD.ownGoal, s.los - 10);
  s.drive = { events: [], i: 0, timer: 0, done: false, over: false };
  if (afterTheirScore) s.drive.pending = true;
  simulateTheirDrive();
}

function simulateTheirDrive() {
  const s = G.st, d = s.drive, rng = RNG;
  // Their quality against yours. This used to be ×0.012, which combined with
  // the multipliers below scaled their yardage anywhere from 6% to 164% of
  // normal — so picking the best team in the league against a middling one
  // quietly shut the opponent out, and the margin came from the team select
  // screen rather than from anything you did with the ball.
  const edge = (s.opp.str - s.defStr) * 0.004;
  // How well the possession goes: the strength gap plus the difficulty's thumb
  // on the scale, bounded. This used to be added straight onto the outcome roll
  // and compared against fixed thresholds, which meant a large enough bonus
  // made an interception arithmetically impossible — at PRO the opponent could
  // not throw one at all. It now bends each threshold by a fraction of itself.
  const lift = clamp(edge + DIFFS[SETTINGS.diff].drive, -0.09, 0.09);
  let los = s.los, down = 1, toGo = 10, guard = 0;

  const toGoal = () => los - FIELD.ownGoal;

  while (guard++ < 40) {
    const deep = toGoal() <= 20;
    const passing = down >= 3 ? toGo > 3 : rng.chance(0.52);
    let line, yards = 0, over = false;

    if (passing) {
      const roll = rng.unit();
      if (roll < 0.029 - lift * 0.18) {
        d.events.push({ text: "INTERCEPTED", los, kind: "turnover" });
        d.endY = clamp(los + rng.range(-6, 14), FIELD.ownGoal + 1, FIELD.oppGoal - 1);
        d.result = "turnover"; over = true;
      } else if (roll < 0.16 - lift * 0.5) {
        yards = -rng.range(5, 9);
        line = "SACKED FOR " + Math.round(-yards);
      } else if (roll < 0.42 - lift * 1.1) {
        line = "PASS INCOMPLETE";
      } else {
        yards = rng.range(3, deep ? 9 : 19) * clamp(1 + lift * 1.6, 0.8, 1.25);
        line = "PASS FOR " + Math.round(yards);
      }
    } else {
      const roll = rng.unit();
      if (roll < 0.012 - lift * 0.08) {
        d.events.push({ text: "FUMBLE · YOU RECOVER", los, kind: "turnover" });
        d.endY = clamp(los, FIELD.ownGoal + 1, FIELD.oppGoal - 1);
        d.result = "turnover"; over = true;
      } else {
        yards = rng.range(-3, deep ? 7 : 12) * clamp(1 + lift * 1.6, 0.8, 1.25);
        line = "RUN FOR " + Math.round(yards);
      }
    }
    if (over) break;

    los = clamp(los - yards, FIELD.ownGoal - 2, FIELD.oppGoal);
    if (line) d.events.push({ text: line, los, kind: "play" });

    if (los <= FIELD.ownGoal) {
      d.events.push({ text: s.opp.ab + " TOUCHDOWN", los: FIELD.ownGoal, kind: "td" });
      d.result = "td"; break;
    }
    toGo -= yards;
    if (toGo <= 0) { down = 1; toGo = 10; d.events.push({ text: "FIRST DOWN", los, kind: "first" }); }
    else down++;

    if (down > 4) {
      const fg = (toGoal() + 17) <= 52;
      if (fg && rng.chance(0.72 - toGoal() * 0.006)) {
        d.events.push({ text: "FIELD GOAL IS GOOD", los, kind: "fg" });
        d.result = "fg"; break;
      }
      if (fg) { d.events.push({ text: "FIELD GOAL MISSED", los, kind: "miss" });
                d.result = "miss"; d.endY = clamp(los + 7, FIELD.ownGoal + 1, FIELD.oppGoal - 1); break; }
      // They punt the way they are driving, so y goes DOWN. This used to read
      // `los + punt`, copied from your own punt where y goes up — which handed
      // you the ball around their 30 every time they gave it up. Your average
      // possession started 35 yards from the end zone; that one sign was worth
      // several touchdowns a game on its own.
      const punt = rng.range(34, 52);
      const land = los - punt;
      d.events.push({ text: "PUNT · " + Math.round(punt) + " YARDS", los, kind: "punt" });
      d.result = "punt";
      d.endY = land <= FIELD.ownGoal ? FIELD.ownGoal + 20 : land;   // touchback
      break;
    }
  }
  if (!d.result) { d.result = "punt"; d.endY = clamp(los - 40, FIELD.ownGoal + 20, FIELD.oppGoal - 20); }
  d.events.push({ text: "", los, kind: "end" });
}

function advanceTheirDrive() {
  const s = G.st, d = s.drive;
  if (!d) return;
  const ev = d.events[d.i];
  if (!ev) return finishTheirDrive();
  s.los = clamp(ev.los, 0, FIELD.L);
  if (ev.kind === "td") { s.them += 7; s.stats.them.td++; Sound.bad(); }
  if (ev.kind === "fg") { s.them += 3; Sound.bad(); }
  if (ev.kind === "first") s.stats.them.first++;
  if (ev.kind === "play") s.stats.them.plays++;
  if (ev.text) s.log.push(ev.text);
  d.i++;
  const isSnap = ev.kind !== "first" && ev.kind !== "end";
  if (isSnap && burn(CFG.simPlaySeconds)) { d.clockOut = true; }
  if (d.i >= d.events.length || d.clockOut) finishTheirDrive();
}

function finishTheirDrive() {
  const s = G.st, d = s.drive;
  if (d.clockOut) {
    const gameOver = endOfQuarter();
    if (gameOver || s.phase === "final") { s.drive = null; return; }
    // A drive that runs into the end of a quarter continues in the next one.
    // Throwing it away is why the opponent used to never score.
    if (d.i < d.events.length) { d.clockOut = false; return; }
  }
  s.drive = null;
  if (s.phase === "final") return;
  const r = d.result;
  // Your defence never takes the field, so it is graded on outcomes: every
  // possession they end without points is a stop, and a takeaway is worth more.
  if (s.season) {
    if (r === "turnover") { s.dstat.stops++; s.dstat.takeaways++; }
    else if (r === "punt" || r === "miss") s.dstat.stops++;
  }
  if (r === "td" || r === "fg") { giveUs(FIELD.ownGoal + 25); say("YOUR BALL", 1.0); return; }
  giveUs(d.endY != null ? d.endY : FIELD.ownGoal + 25);
  say("YOUR BALL", 1.0);
}

/* ---- starting a snap ---------------------------------------------- */
// Three answers to whatever they have just lined up in: something on the
// ground, something quick, and a shot. The defence has already declared by the
// time you see this, so changing the call is a real read rather than a reroll.
function pickAudibles(current) {
  const trio = ["dive", "slants", "verts"];
  const out = [];
  for (const id of trio) if (id !== current.id) out.push(playById(id));
  for (const p of PLAYS) {
    if (out.length >= 3) break;
    if (p.id !== current.id && !out.includes(p)) out.push(p);
  }
  return out.slice(0, 3).map(p => p.id);
}

function snapPlay(play) {
  const s = G.st;
  s.chosen = play;
  s.scheme = callScheme({ down: s.down, toGo: s.toGo, los: s.los, q: s.q,
                          clock: s.clock, us: s.us, them: s.them }, RNG);
  s.audibles = pickAudibles(play);
  buildSnap(play);
}

// Change the call at the line. The front stays exactly as it was — they have
// already shown you their hand, and this is you playing it.
function reCall(play) {
  const s = G.st;
  s.chosen = play;
  s.audibles = pickAudibles(play);
  buildSnap(play);
  Sound.blip();
}

function buildSnap(play) {
  const s = G.st;
  G.acc = 0;
  fxReset();
  G.play = makePlay({
    play, scheme: s.scheme,
    los: s.los, ballX: s.ballX, lineToGain: s.lineToGain,
    offense: s.myRoster, defense: s.oppRoster,
    seed: RNG.next(),
  });
  s.phase = "presnap";
}

function punt() {
  const s = G.st;
  const power = scaled(s.myRoster.k.r.pow, 34, 54);
  const land = clamp(s.los + power + RNG.range(-5, 6), 0, FIELD.L);
  Sound.kick();
  say("PUNT", 1.2);
  burn(8);
  startTheirDrive(land >= FIELD.oppGoal ? FIELD.oppGoal - 20 : land);
}

/* ===================================================================
   RENDER — the field runs left to right and the phone is held on its
   side. The simulation still thinks in "y is downfield, x is across";
   the rotation lives here and in the input handler, and nowhere else.

   Everything is drawn in art pixels, but positions are rounded to
   DEVICE pixels rather than art pixels. Sprites are pre-baked at the
   art scale and blitted 1:1, so they stay crisp while moving on a grid
   six times finer — which is the difference between smooth and choppy
   at this zoom.
   =================================================================== */
const COL = {
  night: "#0E141A", night2: "#141C24", panel: "#1A242E", panelHi: "#22303C",
  edge: "#2B3A47", turf: "#2E6B3A", mow: "#276033", turfDark: "#20512A",
  chalk: "#E8EFE4", chalkDim: "#9FB3A4", flood: "#F5C542", ink: "#E6EDF2",
  dim: "#8296A3", good: "#5FD07A", bad: "#D9453C", shadow: "rgba(0,0,0,.35)",
};

/* ---- the two canvases ---------------------------------------------
   Everything is drawn at ONE art unit per pixel into an off-screen
   buffer a few hundred pixels across, and that buffer is blown up to
   the display in a single nearest-neighbour blit at the end of the
   frame. That is the whole of the pixel look: a real pixel grid that
   nothing can draw between, rather than a high-resolution picture of
   some squares.

   It also means the game renders about a twenty-fifth of the pixels it
   used to, which is most of why it holds sixty on a phone.
   ------------------------------------------------------------------ */
const cv = document.getElementById("screen");
const screenCtx = cv.getContext("2d", { alpha: false });
const backCv = document.createElement("canvas");
const ctx = backCv.getContext("2d", { alpha: false });
let UNIT = 5, ARTW = 500, ARTH = 230, PPY = 7, VIEWTOP = 0, VIEWH = 0;
let NEEDS_ROTATE = false;
let fieldCv = null, fieldKey = "";

// Art units ARE pixels now, so this is the identity — it stays because it
// marks every place a drawing call crosses from art space into the buffer.
const D = a => a;
const DI = a => Math.round(a);

// One blit, no filtering: each art pixel becomes a hard UNIT-sized square.
function present() {
  screenCtx.imageSmoothingEnabled = false;
  screenCtx.drawImage(backCv, 0, 0, ARTW, ARTH, 0, 0, ARTW * UNIT, ARTH * UNIT);
}

function resize() {
  const shell = document.getElementById("shell");
  const cssW = Math.max(1, shell.clientWidth), cssH = Math.max(1, shell.clientHeight);
  const dpr = Math.min(3, window.devicePixelRatio || 1);

  // Landscape game: the field's width fits the screen's height.
  NEEDS_ROTATE = cssW < cssH * 1.15;

  // Held the wrong way up, the short side is the width — sizing off the long
  // one gave a buffer a hundred pixels across and the turn-your-phone card
  // ran off both edges of it.
  const shortSide = NEEDS_ROTATE ? cssW : cssH;
  UNIT = Math.max(2, Math.round(shortSide * dpr / CFG.artH));
  ARTH = Math.floor(cssH * dpr / UNIT);
  ARTW = Math.floor(cssW * dpr / UNIT);

  cv.width = ARTW * UNIT;
  cv.height = ARTH * UNIT;
  cv.style.width = (cv.width / dpr) + "px";
  cv.style.height = (cv.height / dpr) + "px";
  backCv.width = ARTW;
  backCv.height = ARTH;
  // The buffer draws shapes with anti-aliasing — that is the shading on a
  // helmet — but never resamples an image, so its own smoothing stays off.
  ctx.imageSmoothingEnabled = false;
  screenCtx.imageSmoothingEnabled = false;

  VIEWTOP = Math.round(ARTH * 0.1);
  VIEWH = ARTH - VIEWTOP;
  PPY = VIEWH / CFG.visibleW;
  fieldKey = "";
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 120));

/* ---- text ---------------------------------------------------------
   A word is baked once into a one-pixel-per-pixel canvas and then blitted
   wherever it is needed, at whole multiples of its own size. Because the
   cache is keyed on the string, a screen full of unchanging labels costs
   one drawImage each.
   ------------------------------------------------------------------ */
const textCache = new Map();
function textCanvas(str, color) {
  const key = str + "|" + color;
  const hit = textCache.get(key);
  if (hit) return hit;
  const c = document.createElement("canvas");
  c.width = Math.max(1, textW(str)); c.height = GH;
  const g = c.getContext("2d");
  g.fillStyle = color;
  let ox = 0;
  for (const ch of str) {
    const rows = glyphRows(ch);
    for (let y = 0; y < GH; y++) {
      const row = rows[y];
      for (let x = 0; x < GW; x++) if (row[x] === "#") g.fillRect(ox + x, y, 1, 1);
    }
    ox += GW + TRACK;
  }
  if (textCache.size > 600) textCache.clear();
  textCache.set(key, c);
  return c;
}

// x, y in art pixels; y is the top of the seven-pixel cap. align: -1 left,
// 0 centre, 1 right. Scale is a whole number, so letters never land half on
// a pixel.
function text(str, x, y, { scale = 1, color = COL.ink, align = 0, shadow = true } = {}) {
  if (str === null || str === undefined || str === "") return;
  str = String(str);
  const c = textCanvas(str, color);
  const w = c.width * scale, h = c.height * scale;
  const ax = Math.round(align < 0 ? x : align > 0 ? x - w : x - w / 2), ay = Math.round(y);
  if (shadow) ctx.drawImage(textCanvas(str, "#080B0E"), ax + 1, ay + 1, w, h);
  ctx.drawImage(c, ax, ay, w, h);
}

// The same face, blown up as far as you like, for the paint on the turf.
function textInto(g, str, cx, cy, scale, color) {
  const c = textCanvas(str, color);
  g.imageSmoothingEnabled = false;
  g.drawImage(c, Math.round(cx - c.width * scale / 2), Math.round(cy - GH * scale / 2),
              c.width * scale, GH * scale);
}
const rect = (x, y, w, h, col) => {
  const x0 = Math.round(x), y0 = Math.round(y);
  ctx.fillStyle = col;
  ctx.fillRect(x0, y0, Math.max(1, Math.round(x + w) - x0),
                       Math.max(1, Math.round(y + h) - y0));
};
function panel(x, y, w, h, fill = COL.panel, edge = COL.edge) {
  rect(x - 1, y - 1, w + 2, h + 2, edge);
  rect(x, y, w, h, fill);
}

/* ---- the field, baked once --------------------------------------- */
function buildField() {
  const key = G.st.my.ab + G.st.opp.ab + "|" + VIEWH + "|" + UNIT + "|" + driveRight();
  if (fieldKey === key) return;
  fieldKey = key;

  // A margin of turf beyond each back line, so the camera can pan far enough
  // to show the goalposts instead of pinning them to the screen edge.
  const w = Math.ceil((FIELD.L + FIELD_MARGIN * 2) * PPY);
  const h = Math.ceil(FIELD.W * PPY);
  fieldCv = document.createElement("canvas");
  fieldCv.width = w; fieldCv.height = h;
  const g = fieldCv.getContext("2d");
  g.imageSmoothingEnabled = false;
  const R = (x, y, ww, hh, c) => {
    const x0 = Math.round(x), y0 = Math.round(y);
    g.fillStyle = c;
    g.fillRect(x0, y0, Math.max(1, Math.round(x + ww) - x0),
                       Math.max(1, Math.round(y + hh) - y0));
  };
  const X = fieldX;
  // Anything spanning two yard lines has to be expressed as a pair of ends,
  // not an origin and a width — the width changes sign when the field flips.
  const band = (fyA, fyB, y, hh, c) => {
    const a = X(fyA), b = X(fyB);
    R(Math.min(a, b), y, Math.abs(b - a), hh, c);
  };
  const Y = fx => (FIELD.W - fx) * PPY;        // field width  → canvas row

  R(0, 0, w, h, COL.turfDark);                 // the margin, behind the posts
  band(0, FIELD.L, 0, h, COL.turf);
  for (let y = FIELD.ownGoal; y < FIELD.oppGoal; y += 10)
    band(y + 5, y + 10, 0, h, COL.mow);

  // Your end zone sits behind you and theirs in front, whichever way that is.
  band(0, FIELD.ownGoal, 0, h, G.st.my.jersey);
  band(FIELD.oppGoal, FIELD.L, 0, h, G.st.opp.jersey);

  // End-zone lettering, rotated to run up the back of each zone.
  const nameFor = (t, cxArt, flip) => {
    const name = t.nick.slice(0, 11).toUpperCase();
    const scale = Math.max(1, Math.floor((h - 16) / textW(name)));
    g.save();
    g.translate(Math.round(cxArt), Math.round(h / 2));
    g.rotate(flip ? Math.PI / 2 : -Math.PI / 2);
    textInto(g, name, 0, 0, scale, t.trim);
    g.restore();
  };
  nameFor(G.st.my, X(FIELD.ownGoal / 2), driveRight());
  nameFor(G.st.opp, X(FIELD.oppGoal + FIELD.EZ / 2), !driveRight());

  const thick = Math.max(1, Math.round(PPY * 0.24));
  for (let y = FIELD.ownGoal; y <= FIELD.oppGoal + 0.01; y += 5) {
    const goal = (y === FIELD.ownGoal || y === FIELD.oppGoal);
    R(X(y) - (goal ? thick : thick / 2), 0, goal ? thick * 2 : thick, h, COL.chalk);
  }
  // Hash marks, one per yard.
  for (let y = FIELD.ownGoal + 1; y < FIELD.oppGoal; y++) {
    if (y % 5 === 0) continue;
    R(X(y), Y(FIELD.W * 0.64), 1, 1.4 * PPY, COL.chalkDim);
    R(X(y), Y(FIELD.W * 0.36) - 1.4 * PPY, 1, 1.4 * PPY, COL.chalkDim);
  }
  // Painted numbers down both sidelines, rotated to face in from the touchline.
  for (let y = FIELD.ownGoal + 10; y <= FIELD.oppGoal - 10; y += 10) {
    const toGoal = FIELD.oppGoal - y;
    const label = String(toGoal > 50 ? 100 - toGoal : toGoal);
    for (const [rowY, rot] of [[Y(FIELD.W - 6), -Math.PI / 2], [Y(6), Math.PI / 2]]) {
      g.save();
      g.translate(Math.round(X(y)), Math.round(rowY));
      g.rotate(rot);
      textInto(g, label, 0, 0, Math.max(1, Math.round(PPY * 0.34)), COL.chalkDim);
      g.restore();
    }
  }
  // Sidelines.
  band(0, FIELD.L, 0, 1, COL.chalk);
  band(0, FIELD.L, h - 1, 1, COL.chalk);

  // Goalposts on both back lines, drawn the same shape the kick screen draws
  // them so they do not change when you line one up.
  for (const backY of [0, FIELD.L]) {
    const gx = X(backY);
    const a = Y(FIELD.midY + FIELD.uprightHalf), b = Y(FIELD.midY - FIELD.uprightHalf);
    const top = Math.min(a, b), bot = Math.max(a, b);
    // Into the field is away from whichever back line this is.
    const inward = (backY === 0) === driveRight() ? 1 : -1;
    const ARM = 11;
    const bar = (x, y, w, h) => {
      R(x - 1, y - 1, w + 2, h + 2, "#7A5D0E");
      R(x, y, w, h, "#F2D53C");
      R(x, y, w, 1, "#FFF4A0");
    };
    R(gx - inward * 2 + 2, top + 2, 4, bot - top, "rgba(0,0,0,.25)");
    bar(gx - inward * 8, (top + bot) / 2 - 2, 8, 4);
    bar(gx - 2, top, 4, bot - top);
    for (const y of [top, bot]) bar(gx + (inward < 0 ? -ARM : 2), y - 2, ARM, 4);
  }
}

/* ---- camera ------------------------------------------------------ */
const FIELD_MARGIN = 9;      // yards of turf drawn beyond each back line
let camX = 0, camY = 0;

/* ---- which way you attack ------------------------------------------
   The simulation always counts yards the same way: y = 110 is the end
   zone you are attacking, whatever the screen is doing. This function,
   `scrX`, and the input handler are the only things that know which way
   that points on a display — which is what makes the setting a one-line
   change rather than a rewrite.
   ------------------------------------------------------------------ */
const driveRight = () => !!SETTINGS.driveRight;
const fieldX = fy => (driveRight() ? fy + FIELD_MARGIN
                                   : FIELD.L + FIELD_MARGIN - fy) * PPY;
// The inverse: what yard line is under this screen column.
const fyAtScreen = px => driveRight() ? (camX + px) / PPY - FIELD_MARGIN
                                      : FIELD.L + FIELD_MARGIN - (camX + px) / PPY;
function focusY() {
  const s = G.st;
  // On a kick, sit between the tee and the posts so you can see what you are
  // aiming at.
  if (s.phase === "kick" && s.kick) return (s.kick.spotY + FIELD.L) / 2 - 4;
  if (G.play && !G.play.over) {
    const b = G.play.ball;
    return b.y + (b.state === "held" ? 4 : 0);
  }
  return s.los + 8;
}
// Where the action is, across the field — used for the vertical follow.
function focusX() {
  const s = G.st;
  if (s.phase === "kick" && s.kick) return s.kick.spotX;
  if (G.play && !G.play.over) return G.play.ball.x;
  return s.ballX;
}
function updateCamera(dt, snap) {
  const fieldW = (FIELD.L + FIELD_MARGIN * 2) * PPY;
  const fieldH = FIELD.W * PPY;
  // The ball sits behind the action so you can see where you are going. On a
  // turnover the play is running the other way, so the bias flips with it —
  // otherwise the return you are chasing happens in the narrow strip of screen
  // behind the ball. Attacking rightward mirrors the whole thing.
  let lead = (G.play && G.play.turnover) ? 0.38 : 0.62;
  if (driveRight()) lead = 1 - lead;
  const tx = clamp(fieldX(focusY()) - ARTW * lead,
                   0, Math.max(0, fieldW - ARTW));
  const ty = clamp((FIELD.W - focusX()) * PPY - VIEWH * 0.5,
                   0, Math.max(0, fieldH - VIEWH));
  if (snap) { camX = tx; camY = ty; return; }
  const k = 1 - Math.pow(0.0016, dt);
  camX += (tx - camX) * k;
  // The across-field follow is lazier; snapping to every sidestep is nauseating.
  camY += (ty - camY) * (1 - Math.pow(0.02, dt));
}
// Field point → screen. These two are the entire rotation.
const scrX = fy => fieldX(fy) - camX;
const scrY = fx => VIEWTOP + (FIELD.W - fx) * PPY - camY;

/* ---- effects ------------------------------------------------------
   Small, cheap, and driven entirely by watching the simulation rather
   than by the simulation telling the renderer anything. Contact throws
   up turf, a caught ball is held for a beat, and a thrown ball leaves a
   trail so you can read where it is going.
   ------------------------------------------------------------------ */
const FX = { puffs: [], trail: [], catchPose: null, throwPose: 0, freeze: 0,
             prevBall: "dead", prevCaught: false, prevThrew: false,
             airDir: { x: 0, y: 1 }, loose: null };

function fxReset() {
  FX.puffs.length = 0; FX.trail.length = 0;
  FX.catchPose = null; FX.throwPose = 0;
  FX.prevBall = "dead"; FX.prevCaught = false; FX.prevThrew = false;
}

function fxUpdate(dt, sim) {
  for (let i = FX.puffs.length - 1; i >= 0; i--) {
    const q = FX.puffs[i];
    q.t += dt;
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.vx *= 0.92; q.vy *= 0.92;
    if (q.t >= q.life) FX.puffs.splice(i, 1);
  }
  if (FX.catchPose) {
    FX.catchPose.t -= dt;
    if (FX.catchPose.t <= 0) FX.catchPose = null;
  }
  FX.throwPose = Math.max(0, FX.throwPose - dt);
  FX.freeze = Math.max(0, FX.freeze - dt);
  if (!sim) { FX.trail.length = 0; FX.prevBall = "dead"; FX.loose = null; return; }

  // The follow-through starts on the frame the ball leaves his hand.
  if (sim.threw && !FX.prevThrew) FX.throwPose = CFG.followTime;
  FX.prevThrew = sim.threw;

  const b = sim.ball;
  if (b.state === "air") {
    FX.trail.push({ x: b.x, y: b.y, h: b.h });
    if (FX.trail.length > 9) FX.trail.shift();
  } else if (FX.trail.length) {
    FX.trail.shift();      // let it drain rather than vanish
  }

  // Hold the catch pose off the simulation's own flag rather than off a ball
  // state transition — the transition can fall between two frames when the
  // step loop runs several substeps, and then the pose never shows.
  if (sim.completed && !FX.prevCaught) {
    const c = sim.P.find(pl => pl.hasBall);
    if (c) { FX.catchPose = { id: c.id, t: 0.4 }; puffAt(c.x, c.y, 4, 2.2); }
  }
  FX.prevCaught = sim.completed;

  // Remember which way the throw was travelling, so a ball that is not caught
  // carries on in the direction it was going instead of dying where it lands.
  if (b.state === "air") {
    const dx = b.tx - b.fx, dy = b.ty - b.fy, l = Math.hypot(dx, dy) || 1;
    FX.airDir = { x: dx / l, y: dy / l };
  }

  // A ball that went from the air to dead hit the grass. It bounces, and it
  // rolls, and it takes a moment about it — a pass that simply vanished on
  // the frame it arrived was the flattest thing in the game.
  if (FX.prevBall === "air" && b.state === "dead") {
    puffAt(b.x, b.y, 5, 1.6);
    const sp = 5.5 + Math.random() * 2.5;
    FX.loose = {
      x: b.x, y: b.y, h: 1.1,
      vx: FX.airDir.x * sp * 0.35 + (Math.random() - 0.5) * 1.6,
      vy: FX.airDir.y * sp,
      vh: -5.5, spin: 0, t: 0,   // h is height, so coming down is negative
    };
    // Whoever was reaching for it is caught reaching, for a beat.
    let best = null, bd = 2.4;
    for (const p of sim.P) {
      if (p.side !== "off" || p.mot === "down") continue;
      const d = dist(p.x, p.y, b.x, b.y);
      if (d < bd) { bd = d; best = p; }
    }
    if (best) FX.catchPose = { id: best.id, t: 0.45 };
  }
  FX.prevBall = b.state;


  // Anyone who just hit the deck kicks up turf.
  for (const p of sim.P) {
    if (p.mot === "down" && !p._puffed) {
      p._puffed = true;
      const h = p.hit;
      puffAt(p.x + (h ? h.x * 0.4 : 0), p.y + (h ? h.y * 0.4 : 0), h ? 10 : 7, h ? 4.6 : 3.4);
      // Hit stop. Everything holds for a couple of frames on contact, which is
      // the oldest trick there is for making a collision land — without it two
      // men simply pass through the moment of impact and are on the floor.
      if (h && h.deep >= 1) FX.freeze = 0.085;
    }
    else if (p.mot !== "down") p._puffed = false;
  }

  rollLoose(dt);
}

// The bounce and the roll, kept out of the main update so it can also run
// through a dead ball while the play object is being torn down.
function rollLoose(dt) {
  const L = FX.loose;
  if (L) {
    L.t += dt;
    L.vh -= 26 * dt;
    L.h += L.vh * dt;
    if (L.h <= 0) {
      L.h = 0;
      // A football does not bounce true. It kicks up, loses most of its pace,
      // and the next one is smaller.
      if (L.vh < -1.2) { L.vh = -L.vh * 0.42; L.vx *= 0.6; L.vy *= 0.6; puffAt(L.x, L.y, 3, 1.2); }
      else { L.vh = 0; }
    }
    const drag = L.h <= 0 ? Math.max(0, 1 - 3.4 * dt) : 1;
    L.vx *= drag; L.vy *= drag;
    L.x = clamp(L.x + L.vx * dt, 0, FIELD.W);
    L.y = clamp(L.y + L.vy * dt, 0, FIELD.L);
    // A ball on its side rolls end over end; one still in the air tumbles.
    L.spin += (L.h > 0 ? 9 : Math.hypot(L.vx, L.vy) * 1.5) * dt;
    if (L.t > 2.4 || (L.h <= 0 && Math.hypot(L.vx, L.vy) < 0.35 && L.t > 0.6)) FX.loose = null;
  }
}

function puffAt(fx, fy, n, spread) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    FX.puffs.push({
      x: fx, y: fy,
      vx: Math.cos(a) * spread * (0.4 + Math.random() * 0.6),
      vy: Math.sin(a) * spread * (0.4 + Math.random() * 0.6),
      t: 0, life: 0.28 + Math.random() * 0.26,
    });
  }
}

function fxDrawTrail() {
  if (FX.trail.length < 2) return;
  for (let i = 0; i < FX.trail.length - 1; i++) {
    const t = FX.trail[i];
    const a = (i + 1) / FX.trail.length;
    ctx.globalAlpha = a * 0.5;
    const size = 1 + a * 1.5;
    rect(scrX(t.y) - size / 2, scrY(t.x) - t.h * PPY * 0.9 - size / 2, size, size, COL.chalk);
  }
  ctx.globalAlpha = 1;
}

function fxDrawPuffs() {
  for (const q of FX.puffs) {
    const a = 1 - q.t / q.life;
    ctx.globalAlpha = a * 0.55;
    const size = 1 + a * 2;
    rect(scrX(q.y) - size / 2, scrY(q.x) - size / 2, size, size,
         a > 0.6 ? "#CFE0CF" : "#8FA98F");
  }
  ctx.globalAlpha = 1;
}

// The simulation's own `attacking` is closed over inside `makePlay`; the
// renderer has to work it out from the outside, and it flips on a turnover.
const attackingWith = (p, sim) => (p.side === "off") !== sim.turnover;

/* ===================================================================
   FIGURES — the players, drawn rather than blitted.

   Bold flat shapes with a dark edge so a body reads against turf and
   against the man next to it. Everything below is in ART UNITS with the
   figure's feet at the origin and `f` as his facing (+1 right, -1 left),
   which is why no mirroring transform is needed and the jersey number
   still comes out the right way round.

   Build varies by position, so a pile of men is a pile of different
   men: linemen are broad and short-legged, receivers are light and
   long. That was the whole complaint about the old sprites — one body
   in eight jersey colours.
   =================================================================== */
// A man is eighteen pixels tall, so the only thing that can tell one position
// from another at a glance is his outline. The spread is deliberately wider
// than life: a tackle is nearly twice a corner across the shoulders.
const BUILD = {
  QB: { w: 0.98, h: 1.01, pad: 3.4 }, RB: { w: 1.03, h: 0.94, pad: 3.6 },
  WR: { w: 0.87, h: 1.09, pad: 2.9 }, TE: { w: 1.10, h: 1.04, pad: 4.0 },
  OL: { w: 1.22, h: 0.93, pad: 4.8 }, DL: { w: 1.19, h: 0.94, pad: 4.6 },
  LB: { w: 1.07, h: 1.00, pad: 4.1 }, CB: { w: 0.85, h: 1.06, pad: 2.8 },
  S:  { w: 0.93, h: 1.03, pad: 3.2 }, K:  { w: 0.92, h: 0.98, pad: 3.1 },
};
const EDGE = "#0D1116";
const SKIN = "#C98F63";

// Boots have to read against the trousers, and half the league wears white
// trousers while the other half wears black.
const lumOf = hex => {
  const n = parseInt(hex.slice(1), 16);
  return (((n >> 16) & 255) * 0.30 + ((n >> 8) & 255) * 0.59 + (n & 255) * 0.11) / 255;
};
const bootCache = new Map();
function bootFor(pants) {
  let c = bootCache.get(pants);
  if (!c) { c = lumOf(pants) > 0.5 ? "#15191F" : "#EFEEE6"; bootCache.set(pants, c); }
  return c;
}

// A limb or a torso: a thick round-capped line, drawn twice so it carries a
// dark edge. Every shape in a figure is one of these or a circle.
function limb(x1, y1, x2, y2, w, col, edge = 1.5) {
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = EDGE; ctx.lineWidth = w + edge; ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
}
// A translucent pass with nothing under it. `limb` lays its dark outline down
// first, which turns any colour with an alpha into a black one — so shading
// has to go through here instead.
function wash(x1, y1, x2, y2, w, col) {
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
}
function blob(x, y, r, col, edge = 0.8) {
  ctx.beginPath(); ctx.arc(x, y, r + edge, 0, Math.PI * 2);
  ctx.fillStyle = EDGE; ctx.fill();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = col; ctx.fill();
}

/* ---- the animation layer -----------------------------------------
   Every figure carries a small bag of numbers — where his hands are,
   how far he is leaning, how much of him is "running" — and every
   frame those numbers are eased toward what the current pose wants
   rather than snapped to it. That single change is the difference
   between a set of poses and an animation: a man who starts to throw
   winds up through the motion, a man who is tackled falls over rather
   than appearing on his back, and a man standing still is still
   breathing.

   Hand positions are in FORWARD-SPACE — +x is the way he is facing —
   so no pose has to know which way he is pointed.
   ------------------------------------------------------------------ */
// Radians of leg swing per yard covered. At 4.4 a man at full speed took five
// strides a second, which is a sprint cadence played at double speed.
const STRIDE = 2.6;
const EASE = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const approach = (cur, tgt, per, dt) => cur + (tgt - cur) * (1 - Math.pow(per, dt));

// Rest, fully cocked, and follow-through, as [frontX, frontY, backX, backY].
// The FRONT arm is the throwing arm all the way through — the first version
// cocked the back arm and extended the front one, which would have required the
// ball to change hands halfway through the motion.
const THROW_REST = [1.5, 3.2, -1.5, 3.2];
const THROW_COCK = [-3.0, -5.2, 3.0, 0.6];
const THROW_THRU = [6.6, -1.6, -3.2, 2.6];

function animateFigure(p, pose, dt, sim, reach) {
  const a = p._an || (p._an = {
    fx: 1.5, fy: 3.2, bx: -1.5, by: 3.2,
    lean: 0, crouch: 0, run: 0, fall: 0, clock: Math.random() * 6,
  });
  a.clock += dt;

  let fx = 1.5, fy = 3.2, bx = -1.5, by = 3.2, lean = 0, crouch = 0;

  // The throw, as one motion. `u` runs 0..1 through the wind-up and 1..2
  // through the release; outside that it is -1 and he is doing something else.
  let u = -1;
  if (p.idx === 0 && p.side === "off" && !sim.turnover) {
    if (sim.windup >= 0) u = clamp(1 - sim.windup / CFG.throwWind, 0, 1);
    else if (FX.throwPose > 0) u = clamp(2 - FX.throwPose / CFG.followTime, 1, 2);
  }

  if (u >= 0) {
    const from = u <= 1 ? THROW_REST : THROW_COCK;
    const to = u <= 1 ? THROW_COCK : THROW_THRU;
    const e = smooth(u <= 1 ? u : u - 1);
    fx = EASE(from[0], to[0], e); fy = EASE(from[1], to[1], e);
    bx = EASE(from[2], to[2], e); by = EASE(from[3], to[3], e);
    lean = u <= 1 ? -0.4 * e : EASE(-0.4, 1.2, e);
    // A timed motion is driven, not eased toward. Running the sweep through the
    // same lerp as everything else damped a third of a second of throwing
    // motion into a man shrugging — the easing is for transitions BETWEEN held
    // poses, not for a pose that is already moving.
    a.fx = fx; a.fy = fy; a.bx = bx; a.by = by;
    a.lean = approach(a.lean, lean, 0.004, dt);
    a.run = approach(a.run, 0, 0.0005, dt);
    a.crouch = approach(a.crouch, 0, 0.02, dt);
    a.fall = approach(a.fall, 0, 0.02, dt);
    return a;
  }
  if (pose === "down") {
    // Two different men end up on the floor: the one who made the tackle has
    // his arms clamped shut around the other, and the one who was carrying it
    // throws his out. `deep` is what tells them apart.
    const wrapping = p.hit && p.hit.deep < 1;
    if (wrapping) { fx = 5.0; fy = 2.8; bx = 4.4; by = 3.6; lean = 1.6; crouch = 1.4; }
    else { fx = 3.0; fy = -1.6; bx = -3.4; by = 0.4; lean = -0.5; crouch = 0.9; }
    a.fx = approach(a.fx, fx, 0.00005, dt); a.fy = approach(a.fy, fy, 0.00005, dt);
    a.bx = approach(a.bx, bx, 0.00005, dt); a.by = approach(a.by, by, 0.00005, dt);
    a.lean = approach(a.lean, lean, 0.004, dt);
    a.crouch = approach(a.crouch, crouch, 0.004, dt);
    a.run = approach(a.run, 0, 0.0005, dt);
    // A beat of wrap-and-drive before they go over, so the hit reads as a hit
    // rather than as two men lying down next to each other.
    a.hitT = (a.hitT || 0) + dt;
    const deep = (p.hit && p.hit.deep) || 1;
    a.fall = approach(a.fall, a.hitT > 0.12 ? deep : 0, 0.00002, dt);
    return a;
  }
  if (pose === "catch") {
    // Both hands go to the ball, wherever it actually is.
    fx = 3.2; fy = -4.4; bx = 2.0; by = -3.8;
    if (reach) { fx = reach.x + 0.8; fy = reach.y; bx = reach.x - 1.0; by = reach.y + 0.9; }
    lean = 0.3;
  } else if (pose === "tackle") {
    // A tackle is made low and with both arms — he drops his hips, throws his
    // shoulder in and wraps, rather than reaching out to touch the man.
    const w = Math.sin(a.clock * 22) * 0.5;      // the last stride into contact
    fx = 5.8 + w; fy = 2.4; bx = 5.2 + w; by = 3.4; lean = 1.9; crouch = 2.4;
  } else if (pose === "block") {
    fx = 4.9; fy = -0.2; bx = 4.5; by = 1.3; lean = 1.0; crouch = 1.6;
  } else if (pose === "run") {
    // Arms drive: they swing through a real arc rather than sliding sideways,
    // and they rise as they come forward.
    const sw = Math.sin(p._stride * STRIDE);
    fx = sw * 4.2; fy = 2.2 - Math.max(0, sw) * 2.4;
    bx = -sw * 4.2; by = 2.2 - Math.max(0, -sw) * 2.4;
    lean = 0.9;
  } else if (pose === "stumble") {
    // Caught off balance: arms out, weight back.
    fx = 3.4; fy = -2.6; bx = -4.2; by = -1.4; lean = -1.1; crouch = 0.8;
  } else {
    // Standing is not the same as frozen: he shifts his weight.
    const b = Math.sin(a.clock * 1.6) * 0.35;
    fx = 1.5 + b * 0.3; fy = 3.2 + b; bx = -1.5 - b * 0.3; by = 3.2 - b;
  }

  // Hands move quickly, the body settles slowly, and the run blend has to be
  // quick enough that the leg swing is not damped into a shuffle.
  a.fx = approach(a.fx, fx, 0.0002, dt); a.fy = approach(a.fy, fy, 0.0002, dt);
  a.bx = approach(a.bx, bx, 0.0002, dt); a.by = approach(a.by, by, 0.0002, dt);
  a.lean = approach(a.lean, lean, 0.02, dt);
  a.crouch = approach(a.crouch, crouch, 0.02, dt);
  a.run = approach(a.run, pose === "run" ? 1 : 0, 0.0005, dt);
  // Going down takes a moment, and he keeps a little momentum into the turf.
  // Going down takes a moment. How far down depends on who you are: the man
  // with the ball ends up flat, the man who put him there lands across him.
  a.hitT = 0;
  a.fall = approach(a.fall, 0, 0.02, dt);
  return a;
}

function drawFigure(p, team, pose, cx, cy, faceLeft, phase, holding, fallSide) {
  const b = BUILD[p.pos] || BUILD.QB;
  const f = faceLeft ? -1 : 1;
  const fs = fallSide || f;
  const a = p._an || { fx: 1.5, fy: 3.2, bx: -1.5, by: 3.2, lean: 0, crouch: 0, run: 0, fall: 0, clock: 0 };

  ctx.save();
  ctx.translate(D(cx), D(cy));
  ctx.scale(b.w, b.h);

  // He tips over rather than teleporting onto his back, and overshoots a touch
  // on the way down so it lands rather than arrives.
  if (a.fall > 0.002) {
    const e = smooth(clamp(a.fall, 0, 1));
    const over = Math.sin(clamp(a.fall, 0, 1) * Math.PI) * 0.22;
    ctx.rotate(fs * (1.42 * e + over));
    ctx.translate(fs * 3.6 * e, 4.2 * e);
  }

  const jersey = team.jersey, pants = team.pants, helmet = team.helmet, trim = team.trim;
  const hipY = -6.6 + a.crouch * 0.9, padY = -12.3 + a.crouch * 1.5, headY = -15.6 + a.crouch * 1.7;
  const span = b.pad;
  // A running man rides up and down on his stride; a standing one breathes.
  const bob = a.run > 0.05 ? -Math.abs(Math.sin(phase)) * 1.15 * a.run
                           : Math.sin(a.clock * 1.6) * 0.22;

  // ---- legs ------------------------------------------------------------
  const swing = Math.sin(phase) * 4.5;
  const stanceA = pose === "block" || pose === "tackle" ? f * 3.0 : 1.7;
  const stanceB = pose === "block" || pose === "tackle" ? -f * 2.4 : -1.7;
  const la = EASE(stanceA, f * swing, a.run);
  const lb = EASE(stanceB, -f * swing, a.run);
  // Knee lift on the leading leg only, so the stride scissors rather than both
  // feet hopping together.
  const lift = Math.max(0, Math.sin(phase)) * 2.4 * a.run;
  const boot = bootFor(pants);
  const leg = (fx2, fy2) => {
    limb(0, hipY + bob, fx2, fy2 - 1.1, 2.6, pants);           // trouser
    limb(fx2 * 0.96, fy2 - 1.4, fx2, fy2 - 0.2, 1.9, "#1B2027");  // sock
    limb(fx2 - f * 0.5, fy2, fx2 + f * 0.9, fy2, 1.5, boot, 0.5);  // boot
  };
  leg(lb, -0.4);
  leg(la, -0.4 - lift);

  // ---- torso -----------------------------------------------------------
  const leanX = f * a.lean * 1.6;
  limb(0, hipY + 0.4 + bob, leanX * 0.8, padY + 1.2 + bob, 4.6, jersey);
  // The shirt is darker where it tucks in, which is enough to stop the torso
  // reading as one flat slab at this size.
  wash(0, hipY + 0.2 + bob, leanX * 0.3, hipY - 2.4 + bob, 3.6, "rgba(0,0,0,.20)");
  // Shoulders counter-rotate against the hips on every stride, which is most
  // of what sells a run at any size.
  const twist = Math.sin(phase) * 1.5 * a.run;

  // ---- the pads --------------------------------------------------------
  const px0 = leanX * 0.8, py0 = padY + bob;
  limb(px0 - span, py0 + twist, px0 + span, py0 - twist, 3.6, jersey);
  limb(px0 - span * 0.62, py0 - 1.1 + twist * 0.6, px0 + span * 0.62, py0 - 1.1 - twist * 0.6,
       1.0, trim, 0);

  // ---- arms ------------------------------------------------------------
  // Hands are stored in forward-space, so `f` is applied here and nowhere else.
  const shF = px0 + f * span * 0.72, shB = px0 - f * span * 0.72;
  const shY = py0 + 0.9, shYF = shY - twist * f, shYB = shY + twist * f;
  // An arm is two bones. The elbow sits off the line from shoulder to hand,
  // to the outside, by however much the arm is folded — which is the whole
  // difference between a man reaching for a catch and a man holding a plank.
  const REACH = 7.4;
  const hand = (sx, sy, hx, hy) => {
    const ex = sx + f * hx, ey = sy + hy;
    const dx = ex - sx, dy = ey - sy, L = Math.hypot(dx, dy) || 1;
    const bend = clamp(1 - L / REACH, 0, 1) * 1.9 * f;
    const mx = (sx + ex) / 2 - dy / L * bend, my = (sy + ey) / 2 + dx / L * bend;
    limb(sx, sy, mx, my, 2.2, jersey);        // upper arm, still in the sleeve
    limb(mx, my, ex, ey, 1.6, SKIN, 1.1);     // forearm
    blob(ex, ey, 0.95, SKIN, 0.45);           // hand
  };
  hand(shB, shYB, a.bx, a.by);
  hand(shF, shYF, a.fx, a.fy);

  // ---- helmet ----------------------------------------------------------
  const hx = leanX * 1.1 + f * 0.5, hy = headY + bob * 0.55;
  // A collar, so the helmet sits on a neck rather than balancing on the pads.
  limb(px0 + f * 0.3, py0 - 1.4, hx, hy + 1.6, 1.9, SKIN, 1.2);
  blob(hx, hy, 2.3, helmet, 0.8);
  ctx.save();
  ctx.beginPath(); ctx.arc(hx, hy, 2.3, 0, Math.PI * 2); ctx.clip();
  // The centre stripe, and a rake of light off the crown.
  limb(hx - 2.8, hy - 1.5, hx + 2.8, hy - 1.5, 0.9, trim, 0);
  wash(hx - f * 2.4, hy - 2.1, hx + f * 0.4, hy - 2.6, 1.1, "rgba(255,255,255,.26)");
  // The shadow the pads throw up under the jaw.
  wash(hx - 2.8, hy + 2.0, hx + 2.8, hy + 2.0, 1.6, "rgba(0,0,0,.28)");
  ctx.restore();
  // Facemask: a bar off the jaw and a strut up to the shell.
  limb(hx + f * 1.5, hy + 1.5, hx + f * 2.6, hy + 0.9, 0.75, "#C9CEDA", 0.55);
  limb(hx + f * 2.5, hy + 1.0, hx + f * 2.2, hy - 0.4, 0.6, "#C9CEDA", 0.5);

  if (holding) {
    // Tucked under the front arm, and it goes where that arm goes.
    ctx.save();
    ctx.translate(shF + f * a.fx * 0.45, shYF + a.fy * 0.45 + 1.2);
    ctx.rotate(f * -0.55);
    ctx.beginPath(); ctx.ellipse(0, 0, 2.3, 1.4, 0, 0, Math.PI * 2);
    ctx.fillStyle = EDGE; ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 0, 1.8, 1.0, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#8A5228"; ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

/* ---- the posts -----------------------------------------------------
   Seen from above and slightly behind, so the crossbar runs across the
   screen and the uprights stand up out of it. `y0` and `y1` are the two
   ends of the crossbar in screen rows.
   ------------------------------------------------------------------ */
const POST = "#F2D53C", POST_LIT = "#FFF4A0", POST_DARK = "#7A5D0E";
function goalPost(gx, y0, y1) {
  const top = Math.min(y0, y1), bot = Math.max(y0, y1);
  // Which way is into the field of play. The uprights lean that way, which is
  // what turns a bare vertical stroke into a goalpost you can read from
  // above: drawn straight up out of the crossbar they merge with it and the
  // whole thing looks like one yellow stick.
  const inward = driveRight() ? -1 : 1;
  const ARM = 11;                       // how far the uprights reach in
  const bar = (x, y, w, h) => {
    rect(x - 1, y - 1, w + 2, h + 2, POST_DARK);
    rect(x, y, w, h, POST);
    rect(x, y, w, 1, POST_LIT);
  };
  // Shadow first, offset away from the play.
  rect(gx - inward * 2 + 2, top + 2, 4, bot - top, "rgba(0,0,0,.25)");
  // The pole, running back out of the field behind the crossbar.
  bar(gx - inward * 8, (top + bot) / 2 - 2, 8, 4);
  // Crossbar.
  bar(gx - 2, top, 4, bot - top);
  // An upright off each end, reaching into the field.
  for (const y of [top, bot]) bar(gx + (inward < 0 ? -ARM : 2), y - 2, ARM, 4);
}

// The ball in flight or on the floor.
function drawBall(cx, cy, lift, spin) {
  ctx.save();
  ctx.translate(cx, cy - lift);
  ctx.rotate(spin || 0);
  ctx.beginPath(); ctx.ellipse(0, 0, 2.7, 1.7, 0, 0, Math.PI * 2);
  ctx.fillStyle = EDGE; ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, 0, 2.1, 1.2, 0, 0, Math.PI * 2);
  ctx.fillStyle = "#8A5228"; ctx.fill();
  ctx.strokeStyle = "#F0EDE4"; ctx.lineWidth = 0.35; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-0.8, 0); ctx.lineTo(0.8, 0); ctx.stroke();
  ctx.restore();
}

/* ---- the play ---------------------------------------------------- */
function drawField() {
  const shake = G.play ? G.play.shake : 0;
  const ox = shake > 0 ? Math.round((Math.random() - 0.5) * shake * 7) : 0;
  const oy = shake > 0 ? Math.round((Math.random() - 0.5) * shake * 7) : 0;
  ctx.drawImage(fieldCv, Math.round(camX - ox), Math.round(camY - oy), ARTW, VIEWH,
                0, Math.round(VIEWTOP), ARTW, VIEWH);
}

function drawLines() {
  const s = G.st;
  if (s.phase === "defense" || s.phase === "final") return;
  const lx = scrX(s.los);
  if (lx > -4 && lx < ARTW + 4) rect(lx, VIEWTOP, 1, VIEWH, "#7FB6E8");
  if (s.poss === "us" && s.lineToGain < FIELD.oppGoal - 0.01) {
    const gx = scrX(s.lineToGain);
    if (gx > -4 && gx < ARTW + 4) rect(gx, VIEWTOP, 1, VIEWH, COL.flood);
  }
}

/* ---- the call, drawn on the grass ----------------------------------
   The play sheet shows you a postage stamp of the route tree, and then
   you tap it and the diagram disappears — which is exactly the moment
   you need it, standing over the ball trying to remember who is going
   deep. So it is drawn on the field too, at full size, on the men who
   are actually going to run it. It fades out over the first half second
   after the snap rather than blinking off.
   ------------------------------------------------------------------ */
const ROUTE_FADE = 0.55;
function routeAlpha() {
  const s = G.st;
  if (s.phase === "presnap") return 1;
  if (s.phase !== "live" || !G.play || !G.play.snapped) return 0;
  return clamp(1 - G.play.t / ROUTE_FADE, 0, 1);
}

function drawRoutes() {
  const a = routeAlpha();
  if (a <= 0.01 || !G.play) return;
  const sim = G.play;

  // Solid lines, not dashes. A dotted path is harder to follow at a glance
  // than a drawn one — you end up reading the gaps.
  const paths = [];
  for (const p of sim.P) {
    if (p.side !== "off") continue;
    const j = p.job;
    // Fixed colours rather than the club's, so a route never comes out the
    // same yellow as the line to gain.
    let pts = null, col = "#5FD07A";
    if (j.t === "route" || j.t === "delay") pts = p.route;
    else if (j.t === "carry") { pts = p.route; col = "#F2F5F7"; }
    else if (j.t === "drop") { pts = [{ x: p.x, y: p.y - j.depth }]; col = "#7FB6E8"; }
    if (!pts || !pts.length) continue;
    const poly = [[scrX(p.y), scrY(p.x)]];
    for (const n of pts) poly.push([scrX(n.y), scrY(n.x)]);
    paths.push({ poly, col });
  }
  // A handoff is a path too — from the man giving it to the man taking it.
  const qb = sim.P[0], rb = sim.P.find(q => q.side === "off" && q.job.t === "carry");
  if (qb && rb && qb.job.t === "hand")
    paths.push({ poly: [[scrX(qb.y), scrY(qb.x)], [scrX(rb.y), scrY(rb.x)]], col: "#F2F5F7" });

  // Every outline first, then every fill, so one route's dark edge cannot cut
  // a notch out of the route drawn before it.
  const stroke = (poly, w, col) => {
    ctx.globalAlpha = a;
    for (let i = 0; i < poly.length - 1; i++) {
      const [ax, ay] = poly[i], [bx, by] = poly[i + 1];
      const n = Math.max(1, Math.round(Math.hypot(bx - ax, by - ay) * 2));
      for (let k = 0; k <= n; k++) {
        const t = k / n;
        rect(Math.round(lerp(ax, bx, t)) - w, Math.round(lerp(ay, by, t)) - w, w * 2, w * 2, col);
      }
    }
    ctx.globalAlpha = 1;
  };
  for (const q of paths) stroke(q.poly, 2, "#12331C");
  for (const q of paths) stroke(q.poly, 1, q.col);
  // A blob on the end, so you can see where a route stops.
  ctx.globalAlpha = a;
  for (const q of paths) {
    const [ex, ey] = q.poly[q.poly.length - 1];
    rect(ex - 2, ey - 2, 5, 5, "#12331C");
    rect(ex - 1.5, ey - 1.5, 4, 4, q.col);
  }
  ctx.globalAlpha = 1;
}

function drawPlayers(dt) {
  const sim = G.play;
  fxUpdate(dt, sim);
  if (FX.freeze > 0) dt = 0;          // poses and strides hold through a hit
  fxDrawPuffs();
  if (!sim) return;
  // Players nearer the bottom touchline overlap those behind them.
  const order = sim.P.slice().sort((a, b) => b.x - a.x);

  for (const p of order) {
    const team = p.side === "off" ? G.st.my : G.st.opp;
    const speed = Math.hypot(p.vx, p.vy);

    // Stride advances with ground covered, so a lineman's legs turn over
    // slower than a receiver's without a second animation table.
    p._stride = (p._stride || 0) + speed * dt;
    let frame;
    const posing = FX.catchPose && FX.catchPose.id === p.id;
    // A quarterback mid-windup, and the man he is about to become a moment
    // after the ball goes.
    const winding = p.idx === 0 && p.side === "off" && sim.windup >= 0;
    const following = p.idx === 0 && p.side === "off" && FX.throwPose > 0;
    // The lunge, only when he is genuinely making one: inside the range the
    // simulation would actually let him try from, closing on the man rather
    // than drifting past him, and not tied up with a blocker. This used to
    // fire at two and a half yards on anybody moving, so half the defence
    // spent the down running around with its arms out.
    const carrier = sim.P.find(q => q.hasBall && q.mot !== "down");
    let lunging = false;
    if (carrier && p !== carrier && !attackingWith(p, sim) && p.mot === "run" && p.eng < 0) {
      const dx = carrier.x - p.x, dy = carrier.y - p.y;
      const d = Math.hypot(dx, dy) || 1;
      lunging = d < CFG.tackleR * 1.5 && (p.vx * dx + p.vy * dy) / d > 1.2;
    }
    if (p.mot === "down") frame = "down";
    else if (winding) frame = "throwIt";
    else if (following) frame = "release";
    else if (posing) frame = "catch";
    else if (lunging) frame = "tackle";
    else if (p.mot === "stumble") frame = "stumble";
    else if (p.mot === "engaged") frame = "block";
    else if (speed < 0.6) frame = "stand";
    else frame = "run";

    let cxA = scrX(p.y), cyA = scrY(p.x);
    if (cxA < -30 || cxA > ARTW + 30) continue;

    // A man who has just been hit carries a little way in the direction he was
    // hit, and falls that way rather than the way he happened to be looking.
    // The slide is drawn, not simulated: the spot the ball is marked at was
    // settled the instant the whistle went.
    let fallSide = 0;
    if (p.hit) {
      const hxs = scrX(p.y + p.hit.y) - cxA, hys = scrY(p.x + p.hit.x) - cyA;
      const hl = Math.hypot(hxs, hys) || 1;
      fallSide = hxs >= 0 ? 1 : -1;
      const slide = smooth(clamp((p._an && p._an.fall) || 0, 0, 1)) * 5.2;
      cxA += hxs / hl * slide; cyA += hys / hl * slide;
    }

    // sin(face) is the downfield component, and downfield is screen-left only
    // when you are attacking that way.
