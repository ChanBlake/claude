    const faceLeft = driveRight() ? Math.sin(p.face) < 0 : Math.sin(p.face) > 0;

    // A ring under the man the thumb is driving, rather than a bar stuck to
    // his shins.
    if (p.id === sim.user && p.mot !== "down") {
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(D(cxA), D(cyA + 0.5), D(6.2), D(2.4), 0, 0, Math.PI * 2);
      ctx.strokeStyle = COL.flood; ctx.lineWidth = D(0.8); ctx.stroke();
      ctx.restore();
    }

    // Shadow, so bodies sit on the turf rather than float.
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(D(cxA), D(cyA), D(4.6), D(1.8), 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,.34)"; ctx.fill();
    ctx.restore();

    // Your skill players are the men on your cards, so they are marked out
    // there too — the ones whose names you know, among ten others who are
    // just doing a job.
    if (p.side === "off" && !sim.turnover && p.idx <= 4 && p.mot !== "down"
        && cxA > -8 && cxA < ARTW + 8)
      text("★", cxA, cyA - 31, { color: COL.flood });

    const holding = p.hasBall && p.mot !== "down" && frame !== "throwIt" && frame !== "release";
    // A man reaching for a catch reaches at the ball, not at a fixed pose.
    let reach = null;
    if (frame === "catch" && sim.ball.state === "air") {
      const rx = (scrX(sim.ball.y) - cxA) * (faceLeft ? -1 : 1);
      const ry = scrY(sim.ball.x) - sim.ball.h * PPY * 0.9 - (cyA - 12);
      const len = Math.hypot(rx, ry) || 1, cap = Math.min(len, 6.5) / len;
      reach = { x: rx * cap, y: ry * cap };
    }
    animateFigure(p, frame, dt, sim, reach);
    drawFigure(p, team, frame, cxA, cyA, faceLeft, p._stride * STRIDE, holding,
               fallSide || (faceLeft ? -1 : 1));
  }

  // Markers over the men you can still throw to, coloured by how much room he
  // has. Green is a man with a step on his cover; red is a man who is covered.
  // A flat marker over everyone told you where they were and nothing else.
  if (sim.qbHasIt() && !sim.tucked) {
    for (const r of sim.targets()) {
      const mx = scrX(r.y), my = scrY(r.x) - 20;
      const room = nearestDefender(sim, r);
      const col = room > 3.6 ? COL.good : room > 2.1 ? COL.flood : COL.bad;
      // A chevron pointing down at him, drawn rather than stacked out of
      // rectangles — the old marker was three blocks and looked it.
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(D(mx - 3.2), D(my));
      ctx.lineTo(D(mx + 3.2), D(my));
      ctx.lineTo(D(mx), D(my + 4.4));
      ctx.closePath();
      ctx.fillStyle = EDGE; ctx.lineWidth = D(1.6); ctx.strokeStyle = EDGE;
      ctx.stroke(); ctx.fillStyle = col; ctx.fill();
      ctx.restore();
    }
  }

  fxDrawTrail();

  const b = sim.ball;
  if (b.state === "air" || b.state === "loose") {
    const L = FX.loose;
    const bx = scrX(L ? L.y : b.y), by = scrY(L ? L.x : b.x);
    const lift = (L ? L.h : b.h) * PPY * 0.9;
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(D(bx), D(by), D(2.6), D(1.1), 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,.28)"; ctx.fill();
    ctx.restore();
    // A ball in flight turns over, one skidding across the grass rolls, and
    // one that has come to rest lies still.
    drawBall(bx, by, lift + 2, b.state === "air" ? b.tt * 9 : L ? L.spin : 0);
  }
}

function drawAim() {
  const sim = G.play, aim = Input.aim;
  if (!sim || !aim || !sim.qbHasIt() || sim.tucked) return;
  const qb = sim.P[0];
  const ax = scrX(aim.y), ay = scrY(aim.x);
  const qx = scrX(qb.y), qy = scrY(qb.x);

  // The preview is the flight, not a ruler. Same arc the ball will actually
  // travel — apex, hang time and all — so what you line up is what you get.
  const yards = dist(qb.x, qb.y, aim.x, aim.y);
  const apex = Math.min(yards * CFG.passArc, CFG.passArcMax);
  const dur = clamp(yards / CFG.passSpeed, 0.22, 2.4);
  const lift = t => apex * 4 * t * (1 - t) * PPY * 0.9;

  // Under pressure the ball goes where it likes, and the reticle should say so
  // before you release rather than after.
  const heat = 1 - clamp(nearestDefender(sim, qb) / CFG.pressureR, 0, 1);
  const aimCol = heat > 0.35 ? COL.bad : COL.flood;

  const span = Math.hypot(ax - qx, ay - qy);
  const steps = Math.max(8, Math.min(30, Math.round(span / 9)));
  for (let i = 1; i <= steps; i++) {
    const t = i / (steps + 1);
    const px = lerp(qx, ax, t), py = lerp(qy, ay, t) - lift(t);
    const size = 2 + Math.round(t * 1.6);
    rect(px - size / 2 - 1, py - size / 2 - 1, size + 2, size + 2, COL.ink);
    rect(px - size / 2, py - size / 2, size, size, aimCol);
  }

  // Where the man nearest the ball will be when it comes down. Leading a
  // receiver is the whole skill of this control scheme and nothing in the game
  // ever showed you what it looked like.
  let lead = null, bd = Infinity;
  for (const r of sim.targets()) {
    const d = dist(r.x, r.y, aim.x, aim.y);
    if (d < bd) { bd = d; lead = r; }
  }
  if (lead) {
    const gx = scrX(lead.y + lead.vy * dur), gy = scrY(lead.x + lead.vx * dur);
    const off = Math.hypot(gx - ax, gy - ay);
    const good = off < 9 ? COL.good : off < 20 ? COL.flood : COL.dim;
    // A hollow ring, so it reads as a prediction rather than a target.
    for (const [dx, dy] of [[-3, 0], [3, 0], [0, -3], [0, 3], [-2, -2], [2, -2], [-2, 2], [2, 2]])
      rect(gx + dx - 1, gy + dy - 1, 2, 2, good);
  }

  const arms = [[-9, -1, 7, 2], [3, -1, 7, 2], [-1, -9, 2, 7], [-1, 3, 2, 7]];
  const jx = heat > 0.35 ? Math.round((Math.random() - 0.5) * heat * 4) : 0;
  const jy = heat > 0.35 ? Math.round((Math.random() - 0.5) * heat * 4) : 0;
  for (const [ox, oy, w, h] of arms) rect(ax + jx + ox - 1, ay + jy + oy - 1, w + 2, h + 2, COL.ink);
  for (const [ox, oy, w, h] of arms) rect(ax + jx + ox, ay + jy + oy, w, h, aimCol);
  rect(ax + jx - 3, ay + jy - 3, 6, 6, COL.ink);
  rect(ax + jx - 2, ay + jy - 2, 4, 4, aimCol);
}

// How much room the quarterback has, in yards. The simulation has its own
// `nearestFoe`, but it is closed over inside the play.
function nearestDefender(sim, p) {
  let best = Infinity;
  for (const q of sim.P) {
    if (q.side === p.side || q.mot === "down") continue;
    best = Math.min(best, dist(q.x, q.y, p.x, p.y));
  }
  return best;
}

/* ---- HUD --------------------------------------------------------- */
function drawHUD() {
  const s = G.st;
  rect(0, 0, ARTW, VIEWTOP, COL.night2);
  rect(0, VIEWTOP - 1, ARTW, 1, COL.edge);
  const mid = Math.round(VIEWTOP / 2 - GH / 2);

  rect(3, 3, 3, VIEWTOP - 6, s.my.trim);
  text(s.my.ab, 10, mid, { align: -1, color: COL.ink });
  text(String(s.us), 10 + textW(s.my.ab) + 8, mid, { align: -1, color: COL.flood });

  rect(ARTW - 6, 3, 3, VIEWTOP - 6, s.opp.trim);
  text(s.opp.ab, ARTW - 10, mid, { align: 1, color: COL.ink });
  text(String(s.them), ARTW - 10 - textW(s.opp.ab) - 8, mid, { align: 1, color: COL.flood });

  const m = Math.max(0, Math.ceil(s.clock));
  const clock = Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0");
  const line = s.poss === "us"
    ? "Q" + clamp(s.q, 1, 4) + "   " + clock + "   " + downText() + "   " + fieldLabel(s.los, true)
    : "Q" + clamp(s.q, 1, 4) + "   " + clock + "   " + s.opp.ab + " BALL";
  text(line, ARTW / 2, mid, { color: COL.ink });
}

function drawBanner() {
  if (!G.banner || G.bannerT <= 0) return;
  const t = G.banner;
  const col = t.tone === "good" ? COL.good : t.tone === "bad" ? COL.bad : COL.flood;
  const w = textW(t.text) * 2 + 18;
  const y = Math.round(VIEWTOP + VIEWH * 0.16);
  // It drops in and settles, and slides back out at the end, rather than
  // blinking on and off between one frame and the next.
  const age = (G.bannerFor || 1) - G.bannerT;
  const inT = clamp(age / 0.16, 0, 1);
  const outT = clamp(G.bannerT / 0.22, 0, 1);
  const drop = (1 - smooth(inT)) * -14 + (1 - smooth(outT)) * -8;
  ctx.save();
  ctx.globalAlpha = Math.min(smooth(inT), smooth(outT));
  panel(ARTW / 2 - w / 2, y + drop, w, 22, COL.night, col);
  text(t.text, ARTW / 2, y + drop + 7, { scale: 2, color: col });
  ctx.restore();
}

function drawRotatePrompt() {
  rect(0, 0, ARTW, ARTH, COL.night);
  const cx = Math.round(ARTW / 2), cy = Math.round(ARTH / 2);
  // This is the one screen drawn on a portrait buffer, so nothing here may
  // assume a landscape width: every size is picked from ARTW.
  const head = "TURN YOUR PHONE", sub2 = "PIXEL BOWL IS PLAYED SIDEWAYS";
  const hs = Math.max(1, Math.min(3, Math.floor((ARTW - 12) / textW(head))));
  const ss = Math.max(1, Math.min(2, Math.floor((ARTW - 12) / textW(sub2))));

  // A little phone, lying down.
  const pw = Math.min(52, Math.round(ARTW * 0.4)), ph = Math.round(pw * 0.62);
  panel(cx - Math.round(pw / 2), cy - ph - 16, pw, ph, COL.panel, COL.flood);
  rect(cx - Math.round(pw / 2) + 5, cy - ph - 11, pw - 10, ph - 10, COL.turf);

  text(head, cx, cy - 2, { scale: hs, color: COL.flood });
  text(sub2, cx, cy + 6 + GH * hs, { scale: ss, color: COL.dim });
}

/* ===================================================================
   IMMEDIATE-MODE UI — panels register their hit boxes as they draw, so
   the layout lives in exactly one place instead of two that drift.
   =================================================================== */
let HOT = [];
function button(id, x, y, w, h, label, opt = {}) {
  HOT.push({ id, x, y, w, h });
  const active = Input.holdId === id;
  panel(x, y + (active ? 1 : 0), w, h,
        opt.primary ? (active ? "#FFD86B" : COL.flood) : (active ? COL.panelHi : COL.panel),
        opt.edge || (opt.primary ? "#8A6C18" : COL.edge));
  let sc = opt.scale || 1;
  // A label that will not fit at the size asked for drops a size before it
  // gets truncated, so a long team name shrinks rather than losing its tail.
  while (sc > 1 && textW(String(label)) * sc > w - 8) sc--;
  const dy = active ? 1 : 0;
  const ty = opt.sub ? y + 3 + dy : Math.round(y + (h - GH * sc) / 2) + dy;
  text(fit(label, w - 6, sc), x + w / 2, ty,
       { scale: sc, color: opt.primary ? "#16202A" : (opt.color || COL.ink), shadow: !opt.primary });
  if (opt.sub) text(fit(opt.sub, w - 6), x + w / 2, y + h - GH - 3 + dy,
                    { color: opt.primary ? "#4A3B0C" : COL.dim, shadow: false });
}
const hitTest = (x, y) => HOT.find(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);

/* ---- route diagrams ------------------------------------------------
   A postage-stamp of the play: the line of scrimmage, a dot per man and
   a dotted path per route. Downfield runs right, matching the field.
   ------------------------------------------------------------------ */
function drawRouteDiagram(play, x, y, w, h, accent) {
  rect(x, y, w, h, COL.turfDark);
  // The card faces the same way the field does, so a route that breaks left on
  // the sheet breaks left on the grass.
  const R = driveRight();
  const losX = x + Math.round(w * (R ? 0.26 : 0.74));
  rect(losX, y + 1, 1, h - 2, "#4A6B52");

  const DEPTH = 26, SPAN = 30;
  const far = R ? x + w - 2 : x + 2;
  // A route deeper than the card is drawn to the edge, not off it — VERTS runs
  // thirty yards and the card only shows twenty-six.
  const px = fy => clamp(losX + (fy / DEPTH) * (far - losX),
                         Math.min(x + 2, far), Math.max(x + w - 2, far));
  const py = lat => y + h / 2 - (lat / SPAN) * (h - 4);

  const trail = (ax, ay, bx, by, col) => {
    const n = Math.max(2, Math.round(Math.hypot(bx - ax, by - ay) * 2));
    for (let i = 1; i <= n; i++) {
      const t = i / n;
      rect(lerp(ax, bx, t) - 0.5, lerp(ay, by, t) - 0.5, 1, 1, col);
    }
  };

  play.jobs.forEach((j, i) => {
    const a = play.form[i];
    const sxp = px(a.y), syp = py(a.x);
    let route = null, col = COL.chalkDim;
    if (j.t === "route" || j.t === "delay") { route = j.route; col = accent; }
    else if (j.t === "carry") { route = j.route; col = COL.accentRun || "#E8613A"; }
    else if (j.t === "drop") { route = [{ x: 0, y: -j.depth }]; col = "#6E8394"; }

    let cx = sxp, cy = syp;
    if (route) {
      for (const n of route) {
        const nx = px(a.y + n.y), ny = py(a.x + n.x);
        trail(cx, cy, nx, ny, col);
        cx = nx; cy = ny;
      }
    }
    rect(sxp - 1, syp - 1, 2, 2, COL.ink);
    rect(sxp - 0.5, syp - 0.5, 1.5, 1.5, j.t === "pass" || j.t === "block" ? COL.chalkDim : COL.text || "#E6EDF2");
  });
}

/* ---- play call ---------------------------------------------------- */
const PLAYS_PER_PAGE = 6;
let playPage = 0;
// On fourth down the first two slots are the decision, not a play, so a page
// holds two fewer calls.
const onFourth = () => !!(G.st && G.st.down === 4 && G.st.tryFor !== "us2");
const perPage = () => PLAYS_PER_PAGE - (onFourth() ? 2 : 0);
const playPages = () => Math.ceil(PLAYS.length / perPage());

function drawPlayCall() {
  const s = G.st;
  const fourth = s.down === 4 && s.tryFor !== "us2";
  const sheetH = 78;
  const y0 = ARTH - sheetH;
  panel(0, y0, ARTW, sheetH, COL.night2, COL.edge);

  text(downText() + "  ·  " + fieldLabel(s.los, true), 8, y0 + 4,
       { align: -1, color: COL.flood });

  if (fourth) text("FOURTH DOWN", ARTW - 8, y0 + 4, { align: 1, color: COL.bad });

  const m = 8, gap = 5, cols = PLAYS_PER_PAGE;
  const cw = Math.floor((ARTW - m * 2 - gap * (cols - 1)) / cols);
  const ch = sheetH - 30;
  const cy = y0 + 18;

  // Fourth down puts the two things you probably want to do first, the same
  // size as everything else. They used to be a pair of thirteen-pixel buttons
  // wedged into the header, which is not a choice you can make with a thumb.
  let slot = 0;
  if (fourth) {
    const bigCard = (id, label, sub2, opt) => {
      const cx = m + slot * (cw + gap);
      button(id, cx, cy, cw, ch, label, Object.assign({ sub: sub2, scale: 2 }, opt || {}));
      slot++;
    };
    bigCard("punt", "PUNT", "KICK IT AWAY");
    if (inFGRange()) bigCard("fg", String(Math.round(fgDistance())) + " YD", "FIELD GOAL", { primary: true });
    else bigCard("nofg", "NO RANGE", "TOO FAR OUT", { color: COL.dim });
  }

  playPage = playPage % Math.max(1, playPages());
  const from = playPage * perPage();
  PLAYS.slice(from, from + perPage()).forEach((play, i) => {
    const cx = m + (i + slot) * (cw + gap);
    HOT.push({ id: "play:" + play.id, x: cx, y: cy, w: cw, h: ch });
    const active = Input.holdId === "play:" + play.id;
    panel(cx, cy, cw, ch, active ? COL.panelHi : COL.panel, COL.edge);
    text(play.name, cx + cw / 2, cy + 3, { color: COL.ink });
    drawRouteDiagram(play, cx + 3, cy + 13, cw - 6, ch - 24, G.st.my.trim);
    text(play.tag, cx + cw / 2, cy + ch - 8, { color: COL.dim, shadow: false });
  });

  // Page dots — swipe the row to change pages.
  const pages = playPages();
  if (pages > 1) {
    const dotW = 7, total = pages * dotW;
    for (let i = 0; i < pages; i++)
      rect(ARTW / 2 - total / 2 + i * dotW, y0 + 9, 4, 3,
           i === playPage ? COL.flood : "#3A4753");
    text("SWIPE", ARTW / 2 + total / 2 + 8, y0 + 8, { align: -1, color: "#4E5F6B", shadow: false });
  }
}

function drawPresnap() {
  const s = G.st;
  const look = readLook(s.scheme);
  // What a quarterback actually gets to read: how many are deep, how many are
  // close enough to be coming, how many are pressed on a receiver. Not the name
  // of the call — that is not printed on their shirts, and being told it made
  // the whole defensive playbook pointless.
  const hint = look.deep === 0 ? "NOBODY DEEP"
             : look.press >= 2 ? "PRESS"
             : look.deep >= 3 ? "DEEP SHELL"
             : look.box >= 5 ? "STACKED BOX"
             : look.deep === 2 ? "TWO HIGH"
             : "BALANCED";

  const ids = s.audibles || [];
  const bw = 84, gap = 4;
  const total = ids.length * bw + Math.max(0, ids.length - 1) * gap;
  const pw = Math.max(300, total + 16), px = Math.round((ARTW - pw) / 2);
  const ph = 46, py = ARTH - ph - 4;
  panel(px, py, pw, ph, COL.night2, COL.edge);

  // The read, on one line: how many are deep, how many are in the box, how
  // many are pressed. Not the name of their call — that is not printed on
  // their shirts.
  const counts = look.deep + " DEEP  ·  " + look.box + " BOX" +
                 (look.press ? "  ·  " + look.press + " PRESSED" : "");
  text(counts, px + 8, py + 4, { align: -1, color: COL.dim, shadow: false });
  text(hint, px + pw - 8, py + 4, { align: 1, color: COL.flood, shadow: false });
  rect(px + 6, py + 13, pw - 12, 1, COL.edge);

  // Three answers, and the front will not change if you take one.
  ids.forEach((id, i) => {
    const pl = playById(id);
    button("audible:" + id, px + (pw - total) / 2 + i * (bw + gap), py + 17, bw, 24,
           pl.name, { sub: pl.tag });
  });

  // The call you are running, and how to run it, tucked above the sheet.
  const run = "RUNNING " + s.chosen.name + "  ·  TAP THE FIELD TO SNAP";
  const rw = textW(run) + 12;
  panel(Math.round(ARTW / 2 - rw / 2), py - 14, rw, 11, COL.night, COL.edge);
  text(run, ARTW / 2, py - 12, { color: COL.dim, shadow: false });
}

function drawLiveControls() {

// A label with something behind it. Anything written straight onto grass is

/* ---- the try ------------------------------------------------------ */

/* ---- kicking ------------------------------------------------------
   Played on the field with the unit lined up, so it looks like a snap
   rather than a slot machine. The rush is cosmetic — you cannot be
   blocked — but the accuracy window is tight and the wind bites.
   ------------------------------------------------------------------ */
function drawKick() {
  const s = G.st, k = s.kick;
  const postsY = FIELD.oppGoal + FIELD.EZ;      // back line, where the posts are

  // The unit, drawn with the same figures as a live play.
  for (const pl of k.players) {
    const team = pl.side === "off" ? s.my : s.opp;
    const pose = pl.role === "kicker" ? (k.flight ? "run" : "stand")
               : pl.role === "hold" ? "catch"
               : pl.side === "def" ? "run" : "block";
    const cxA = scrX(pl.y), cyA = scrY(pl.x);
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(D(cxA), D(cyA), D(4.6), D(1.8), 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,.34)"; ctx.fill();
    ctx.restore();
    const build = pl.role === "line" ? "OL" : pl.role === "kicker" ? "K" : "LB";
    drawFigure({ pos: build, num: 0 }, team, pose, cxA, cyA,
               pl.side === "def" ? !driveRight() : driveRight(), k.t * 5 + pl.x);
  }

  // Goalposts. You are aiming at these, so they are the one thing on the
  // screen allowed to be loud: a shadow on the grass under them, a dark
  // outline so they hold against turf, and a lit edge up each upright.
  const gx = scrX(postsY);
  const upY0 = scrY(FIELD.midY + FIELD.uprightHalf), upY1 = scrY(FIELD.midY - FIELD.uprightHalf);
  goalPost(gx, upY0, upY1);

  // The ball, in hand or in flight.
  if (!k.flight) {
    const bx = scrX(k.spotY), by = scrY(k.spotX);
    drawBall(bx, by, 4, 0.35);
  } else {
    const f = k.flight, t = clamp(f.t / f.dur, 0, 1);
    // A blocked kick never leaves the tee.
    const fy = f.blocked ? k.spotY : lerp(k.spotY, postsY, t);
    const fx = f.blocked ? k.spotX : lerp(k.spotX, FIELD.midY + f.landX, t);
    const lift = f.blocked ? 0 : Math.sin(t * Math.PI) * 9 + t * 3;
    drawBall(scrX(fy), scrY(fx), lift * PPY * 0.5 + 3, f.t * 11);
    if (t >= 1) {
      const label = f.blocked ? "BLOCKED" : f.good ? "GOOD" : (f.hasLeg ? "WIDE" : "SHORT");
      const w = textW(label) * 3 + 20;
      const ly = VIEWTOP + 48;
      panel(ARTW / 2 - w / 2, ly, w, 30, COL.night, f.good ? COL.good : COL.bad);
      text(label, ARTW / 2, ly + 10, { scale: 3, color: f.good ? COL.good : COL.bad });
    }
  }

  if (k.flight) { drawKickMeter(k); return; }

  // Once the ball is snapped the aim line sweeps across the posts and you
  // have to catch it. It is the same marching squares the throw preview uses,
  // so aiming a kick reads like aiming a pass rather than like a different
  // game — and it ends in a bright marker on the goal line, because that is
  // the bit you are actually reading.
  if (k.stage === "aim") {
    const inWindow = Math.abs(k.aimX) <= FIELD.uprightHalf;
    const col = inWindow ? COL.good : COL.flood;
    const steps = 34;
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      const fy = lerp(k.spotY, postsY, t);
      const fx = lerp(k.spotX, FIELD.midY + k.aimX, t);
      const lift = Math.sin(t * Math.PI) * 9 * Math.max(k.power, 0.25);
      const px = scrX(fy), py = scrY(fx) - lift * PPY * 0.5;
      const size = 2 + Math.round(t * 1.4);
      rect(px - size / 2 - 1, py - size / 2 - 1, size + 2, size + 2, COL.ink);
      rect(px - size / 2, py - size / 2, size, size, col);
    }
    const gy = scrY(FIELD.midY + k.aimX), gxx = scrX(postsY);
    rect(gxx - 4, gy - 4, 9, 9, COL.ink);
    rect(gxx - 3, gy - 3, 7, 7, col);
  }

  drawKickMeter(k);
  const hint = k.stage === "power" ? "TAP IN THE GREEN FOR POWER"
                                   : "TAP TO PICK YOUR LINE";
  pill(Math.round(ARTW / 2 - (textW(hint) + 10) / 2), ARTH - 16, hint, COL.ink);
}

/* ---- the power bar -------------------------------------------------
   Two colours, and they are the truth: red is not enough boot to reach
   the posts from here, green is. The boundary is worked back out of the
   same sum the kick is resolved with, so a fifty-yarder really does show
   you a sliver of green and a chip shot really is nearly all green.
   ------------------------------------------------------------------ */
function drawKickMeter(k) {
  const need = clamp((k.dist / k.range - 0.58) / 0.46, 0, 1);
  const bw = Math.min(310, Math.round(ARTW * 0.64)), bh = 14, rowH = 11;
  const mx = Math.round(ARTW / 2 - bw / 2), my = VIEWTOP + 6;
  const at = f => Math.round((bw - 4) * clamp(f, 0, 1));

  // One box holds the bar AND the readout, because anything written straight
  // onto grass disappears the moment it crosses a yard number.
  panel(mx, my, bw, bh + rowH + 3, "#080B0E", COL.edge);
  const bx = mx + 2, by = my + 2, bwi = bw - 4;
  rect(bx, by, at(need), bh - 2, "#C4302A");
  rect(bx + at(need), by, bwi - at(need), bh - 2, "#37B94A");
  // A lit top edge and a shadowed floor, so the bar has some depth to it.
  rect(bx, by, bwi, 1, "rgba(255,255,255,.30)");
  rect(bx, by + bh - 4, bwi, 2, "rgba(0,0,0,.30)");

  // Where the sweep is now — or, once it is locked in, a gold pin you can
  // see you have already spent.
  const locked = k.stage !== "power";
  const px = bx + at(k.power);
  rect(px - 2, by - 2, 4, bh + 2, "#0B0F13");
  rect(px - 1, by - 1, 2, bh, locked ? COL.flood : COL.chalk);
  if (locked) rect(bx, by, bwi, bh - 2, "rgba(8,11,14,.45)");

  // How long you have left to find your line before the rush arrives.
  if (locked && !k.flight) {
    const left = clamp(1 - k.aimT / CFG.kickAimTime, 0, 1);
    rect(bx, by + bh - 4, bwi, 3, "#1A242E");
    rect(bx, by + bh - 4, Math.round(bwi * left), 3, left > 0.35 ? COL.flood : COL.bad);
  }

  const reaches = k.power >= need;
  const ry = my + bh + 2;
  text(k.kind === "xp" ? "EXTRA POINT" : Math.round(k.dist) + " YARDS",
       mx + 5, ry, { align: -1, color: COL.ink, shadow: false });
  const w = k.wind;
  const arrow = w > 0.15 ? "▲" : w < -0.15 ? "▼" : "·";
  text("WIND " + arrow + " " + Math.abs(w).toFixed(1), mx + bw - 5, ry,
       { align: 1, color: Math.abs(w) > 1.1 ? COL.bad : COL.dim, shadow: false });
  if (!k.flight)
    text(locked ? "FIND YOUR LINE" : (reaches ? "LET GO" : "NOT ENOUGH"),
         ARTW / 2, ry,
         { color: locked ? COL.ink : reaches ? COL.good : COL.bad, shadow: false });
}

/* ---- their drive --------------------------------------------------- */
function drawDefense() {
  const s = G.st, d = s.drive;
  rect(0, VIEWTOP, ARTW, VIEWH, "rgba(8,11,14,.66)");
  const w = Math.min(320, ARTW - 40), h = 118;
  const x0 = Math.round((ARTW - w) / 2), y0 = VIEWTOP + Math.round((VIEWH - h) / 2);
  panel(x0, y0, w, h, COL.night2, COL.edge);
  text(s.opp.city + " HAVE THE BALL", x0 + w / 2, y0 + 7, { color: s.opp.trim });

  // The whole drive at a glance, laid out the way the field itself is laid
  // out: your end zone on the RIGHT, theirs on the left, because you attack
  // leftward. This bar used to run the other way, so the instant they took
  // possession the game showed you a field pointing the opposite way to the
  // one you had been playing on all drive — which reads as the whole game
  // turning around.
  const bx = x0 + 12, bw = w - 24, by = y0 + 22;
  const R = driveRight();
  const barX = y => bx + bw * clamp(R ? y / FIELD.L : 1 - y / FIELD.L, 0, 1);
  const ez = bw * (FIELD.EZ / FIELD.L);
  rect(bx, by, bw, 8, COL.turfDark);
  rect(R ? bx : bx + bw - ez, by, ez, 8, s.my.jersey);    // yours, behind you
  rect(R ? bx + bw - ez : bx, by, ez, 8, s.opp.jersey);   // theirs, ahead
  const mx = barX(s.los);
  rect(mx - 1, by - 3, 2, 14, COL.flood);
  // A chevron off the marker, pointing the way they are coming — at you.
  for (let i = 0; i < 4; i++)
    rect(mx + (R ? -2 - i : 2 + i), by + i, 1, 8 - i * 2, COL.flood);
  const goalL = R ? "YOUR GOAL" : s.opp.ab + " GOAL";
  const goalR = R ? s.opp.ab + " GOAL" : "YOUR GOAL";
  text(goalL, bx, by + 13, { align: -1, color: COL.dim, shadow: false });
  text(fieldLabel(s.los, false), x0 + w / 2, by + 13, { color: COL.ink, shadow: false });
  text(goalR, bx + bw, by + 13, { align: 1, color: COL.dim, shadow: false });

  const lines = s.log.slice(-3);
  lines.forEach((l, i) => {
    text(l, x0 + w / 2, y0 + 50 + i * 11,
         { color: i === lines.length - 1 ? COL.ink : COL.dim });
  });

  button("advance", x0 + w / 2 - 52, y0 + h - 22, 104, 16,
         d && d.i < d.events.length ? "NEXT PLAY" : "CONTINUE", { primary: true });
}

/* ---- screens ------------------------------------------------------- */
function drawTitle() {
  rect(0, 0, ARTW, ARTH, COL.night);
  // Floodlit haze, in bands, so the background is not a flat sheet of navy.
  for (let i = 0; i < 9; i++) rect(0, 10 + i * 26, ARTW, 12, i % 2 ? COL.night2 : "#111A22");

  const FOOT = 14;
  const bw = Math.round(ARTW * 0.36), bh = 20, gap = 4;
  const opts = 5;
  const menuH = 32 + 6 + opts * bh + (opts - 1) * gap;
  const top = Math.round((ARTH - FOOT - menuH) / 2);
  const bx = ARTW - bw - Math.round(ARTW * 0.07);

  // The mark, centred against the menu rather than floating above it.
  const lx = Math.round(ARTW * 0.07), ly = top + Math.round(menuH / 2) - 46;
  text("PIXEL", lx, ly, { scale: 5, color: COL.chalk, align: -1 });
  text("BOWL", lx, ly + 40, { scale: 5, color: COL.flood, align: -1 });
  rect(lx, ly + 80, 148, 1, COL.edge);
  text("FOUR DOWNS · ONE THUMB", lx, ly + 86, { color: COL.dim, align: -1 });

  let by = top;
  const has = inSeason();
  button("season", bx, by, bw, 32,
         has ? "YEAR " + LEAGUE.year : "NEW SEASON",
         { primary: true, scale: 2, sub: has ? seasonSub() : "START A CAREER" });
  by += 38;
  const row = (id, label) => { button(id, bx, by, bw, bh, label); by += bh + gap; };
  row("start", "QUICK GAME");
  row("diff", "DIFFICULTY  " + DIFFS[SETTINGS.diff].name);
  row("qlen", "QUARTER  " + SETTINGS.quarter + " MIN");
  row("dir", "YOU ATTACK  " + (SETTINGS.driveRight ? "RIGHT" : "LEFT"));
  row("sfx", "SOUND  " + (SETTINGS.sound ? "ON" : "OFF"));

  rect(0, ARTH - FOOT, ARTW, FOOT, COL.night2);
  rect(0, ARTH - FOOT, ARTW, 1, COL.edge);
  const rec = RECORD.played
    ? RECORD.won + "-" + RECORD.lost + (RECORD.tied ? "-" + RECORD.tied : "") + "   BEST " + RECORD.best
    : "NO GAMES PLAYED YET";
  text(rec, ARTW / 2, ARTH - FOOT + 4, { color: COL.dim, shadow: false });
}

function seasonSub() {
  const c = myClub();
  const rec = c.w + "-" + c.l + (c.t ? "-" + c.t : "");
  if (LEAGUE.phase === "offseason") return teamBy(LEAGUE.my).ab + "  " + rec + "  ·  OFF-SEASON";
  if (LEAGUE.phase === "playoffs") return teamBy(LEAGUE.my).ab + "  " + rec + "  ·  PLAYOFFS";
  return teamBy(LEAGUE.my).ab + "  " + rec + "  ·  WEEK " + (LEAGUE.week + 1);
}

/* ===================================================================
   SEASON SCREENS — the hub, the roster, the table, and the two
   moments that make a career: what a game did to your men, and what a
   year did to them.
   =================================================================== */
const posColour = pos => pos === "QB" ? "#F5C542" : pos === "OL" ? "#8296A3"
                       : pos === "K" ? "#9FB3A4" : "#6FE3D2";

// One man, one row. Position, number, name, age, overall, and how close he is
// to the next rating point.
function drawManRow(p, x, y, w, opt = {}) {
  const ovr = overallOf(p);
  rect(x, y, w, 15, opt.hot ? COL.panelHi : COL.panel);
  rect(x, y, 2, 15, posColour(p.pos));
  text(p.pos, x + 8, y + 4, { align: -1, color: posColour(p.pos), shadow: false });
  text(String(p.num), x + 42, y + 4, { align: 1, color: COL.dim, shadow: false });
  text(p.first + " " + p.last, x + 52, y + 4, { align: -1, color: COL.ink, shadow: false });
  text(String(p.age), x + w - 96, y + 4, { align: 1, color: COL.dim, shadow: false });
  // The bar is progress toward his next point; the tick is his ceiling.
  const bw = 44, bx = x + w - 88;
  rect(bx, y + 5, bw, 5, "#2B3A47");
  rect(bx, y + 5, bw * clamp(p.xp / xpNeeded(p), 0, 1), 5, COL.flood);
  const tick = bx + bw * clamp((p.pot - 40) / 59, 0, 1);
  void tick;
  text(String(ovr), x + w - 30, y + 4,
       { align: 1, color: ovr >= p.pot ? COL.dim : COL.ink, shadow: false });
  text("/" + p.pot, x + w - 6, y + 4, { align: 1, color: COL.dim, shadow: false });
}

// Week by week, left to right: who you played, how it went, where you are.
function drawScheduleStrip(x, y, w, h) {
  panel(x, y, w, h, COL.night2, COL.edge);
  const weeks = LEAGUE.schedule.length;
  const res = LEAGUE.results || [];
  const cw = w / weeks;
  const track = y + Math.round(h / 2);
  rect(x + 6, track, w - 12, 1, "#33424F");

  for (let i = 0; i < weeks; i++) {
    const cx = Math.round(x + cw * (i + 0.5));
    const g = LEAGUE.schedule[i].find(p => p[0] === LEAGUE.my || p[1] === LEAGUE.my);
    const oppAb = !g ? "" : (g[0] === LEAGUE.my ? g[1] : g[0]);
    const home = g && g[0] === LEAGUE.my;
    const r = res[i];
    const now = i === LEAGUE.week && LEAGUE.phase === "regular";
    const col = !r ? (now ? COL.flood : COL.dim)
              : r.us > r.them ? COL.good : r.us < r.them ? COL.bad : COL.ink;

    text((home ? "" : "@") + oppAb, cx, y + 3,
         { color: now ? COL.ink : COL.dim, shadow: false });
    // A filled pip for a game played, a ring for one still to come.
    if (r) { rect(cx - 3, track - 3, 7, 7, col); rect(cx - 2, track - 2, 5, 5, col); }
    else { rect(cx - 3, track - 3, 7, 7, now ? COL.flood : "#3E4C58");
           rect(cx - 2, track - 2, 5, 5, COL.night2); }
    text(r ? (r.us > r.them ? "W" : r.us < r.them ? "L" : "T") + " " + r.us + "-" + r.them
           : (now ? "NEXT" : "-"),
         cx, y + h - 10, { color: col, shadow: false });
  }
}

function drawHub() {
  rect(0, 0, ARTW, ARTH, COL.night);
  const me = teamBy(LEAGUE.my), c = myClub();
  rect(0, 0, ARTW, 26, COL.night2);
  rect(0, 26, ARTW, 1, COL.edge);
  rect(6, 5, 4, 16, me.trim);
  text(me.city + "  " + me.nick, 16, 4, { align: -1, scale: 2, color: COL.ink });
  text("YEAR " + LEAGUE.year + (LEAGUE.title ? "   ·   " + LEAGUE.title + " TITLE" + (LEAGUE.title > 1 ? "S" : "") : ""),
       ARTW - 8, 10, { align: 1, color: COL.flood });

  // The whole season on one track: who, when, and how it went. A hub that
  // only knows about this week tells you nothing about the year you are
  // having.
  drawScheduleStrip(10, 30, ARTW - 20, 34);

  const fx = myFixture();
  const bx = 10, bw = Math.round(ARTW * 0.46);
  panel(bx, 68, bw, 56, COL.night2, COL.edge);
  if (LEAGUE.phase === "offseason") {
    text("SEASON OVER", bx + bw / 2, 76, { scale: 2, color: COL.flood });
    const champ = LEAGUE.champion ? teamBy(LEAGUE.champion) : null;
    text(champ ? fit(champ.city + " TOOK THE TITLE", bw - 12) : "", bx + bw / 2, 92, { color: COL.dim });
    button("offseason", bx + 12, 104, bw - 24, 16, "OFF-SEASON", { primary: true });
  } else if (fx) {
    const oppAb = fx[0] === LEAGUE.my ? fx[1] : fx[0];
    const opp = teamBy(oppAb), oc = LEAGUE.clubs[oppAb];
    text(LEAGUE.phase === "playoffs" ? currentTie().round : "WEEK " + (LEAGUE.week + 1),
         bx + bw / 2, 71, { color: COL.dim });
    // The club's trim colour is right for a stripe and wrong for text — half
    // the league is near-black on a near-black panel.
    rect(bx + 10, 80, 3, 13, opp.trim);
    text(fit((fx[0] === LEAGUE.my ? "VS " : "AT ") + opp.city, bw - 24, 2), bx + bw / 2, 80, { scale: 2, color: COL.ink });
    text(oc.w + "-" + oc.l + (oc.t ? "-" + oc.t : "") + "   ·   " + opp.nick,
         bx + bw / 2, 95, { color: COL.dim });
    button("kickoff", bx + 12, 104, bw - 24, 16, "KICK OFF", { primary: true });
  } else {
    text("WATCHING THE PLAYOFFS", bx + bw / 2, 84, { color: COL.dim });
    button("watch", bx + 12, 104, bw - 24, 16, "CONTINUE", { primary: true });
  }

  // Your record, and the last few results.
  const rx = bx + bw + 10, rw = ARTW - rx - 10;
  panel(rx, 68, rw, 56, COL.night2, COL.edge);
  text(c.w + "-" + c.l + (c.t ? "-" + c.t : ""), rx + rw / 2, 72, { scale: 2, color: COL.ink });
  text(c.pf + " FOR  ·  " + c.pa + " AGAINST", rx + rw / 2, 88, { color: COL.dim, shadow: false });
  // Your squad, as two star rows — the same shorthand the roster uses.
  const off = Math.round(LEAGUE.roster.off.reduce((n, m) => n + overallOf(m), 0) / LEAGUE.roster.off.length);
  const badge = (label, val, col, dim, y) => {
    text(label, rx + 10, y, { align: -1, color: COL.dim, shadow: false });
    starRow(starsOf(val), starsOf(val), rx + 62, y, col, dim);
  };
  badge("OFFENCE", off, "#6FE3D2", "#2C4A47", 100);
  badge("DEFENCE", LEAGUE.def, COL.bad, "#4A2B2B", 110);

  const bw2 = Math.round((ARTW - 30) / 3);
  button("roster", 10, 128, bw2, 20, "ROSTER", { scale: 2 });
  button("table", 15 + bw2, 128, bw2, 20, "TABLE", { scale: 2 });
  button("quit", 20 + bw2 * 2, 128, bw2, 20, "MENU", { scale: 2 });

  // The eleven you are taking out there, at a glance.
  const R = LEAGUE.roster;
  const ch = Math.min(66, ARTH - 172), cy = ARTH - 8 - ch;
  const labelY = cy - 10;
  text("YOUR OFFENCE", 10, labelY, { align: -1, color: COL.flood });
  text("DEFENCE " + LEAGUE.def + "   ·   KICKER " + LEAGUE.roster.k.last + " " + overallOf(LEAGUE.roster.k),
       ARTW - 10, labelY, { align: 1, color: COL.dim, shadow: false });
  const cw = Math.round((ARTW - 20 - 6 * 4) / 7);
  // The strip sits on the bottom edge and everything in a card is measured
  // from the card, so a taller screen does not leave a hole under the names.
  R.off.forEach((p, i) => {
    const x = 10 + i * (cw + 4);
    panel(x, cy, cw, ch, COL.panel, COL.edge);
    rect(x, cy, cw, 2, posColour(p.pos));
    text(p.pos, x + cw / 2, cy + 6, { color: posColour(p.pos), shadow: false });
    text(fit(p.last, cw - 6), x + cw / 2, cy + 17, { color: COL.ink, shadow: false });
    const sn = starsOf(overallOf(p)), sm = starsOf(p.pot);
    const swide = Math.ceil(sm) * (GW + TRACK) - TRACK;
    starRow(sn, sm, Math.round(x + (cw - swide) / 2), cy + 30);
    // How close he is to his next rating point, and to his ceiling.
    const bw3 = cw - 12, bx3 = x + 6;
    rect(bx3, cy + ch - 17, bw3, 4, "#2B3A47");
    rect(bx3, cy + ch - 17, bw3 * clamp(p.xp / xpNeeded(p), 0, 1), 4, COL.flood);
    text("AGE " + p.age, x + cw / 2, cy + ch - 10, { color: COL.dim, shadow: false });
  });
}

const currentTie = () => (LEAGUE.bracket || []).find(g => !g.done && (g.a === LEAGUE.my || g.b === LEAGUE.my)) || { round: "PLAYOFF" };

/* ---- the roster, as a shelf of cards -------------------------------
   Eight men and a defence, laid out two rows of five. A row of numbers
   told you everything and showed you nothing; a card you can pick out
   by its colour and its stars is a squad.
   ------------------------------------------------------------------ */
function rosterCards() {
  const R = LEAGUE.roster;
  return R.off.map((p, i) => ({ p, i })).concat([{ p: R.k, i: -1 }]);
}

function drawManCard(p, x, y, w, h, hot) {
  const col = posColour(p.pos);
  panel(x, y, w, h, hot ? COL.panelHi : COL.panel, hot ? COL.flood : COL.edge);
  // Coloured head, with his shirt number where a photograph would go.
  rect(x, y, w, 15, col);
  text(p.pos, x + 5, y + 4, { align: -1, scale: 1, color: "#10171E", shadow: false });
  text(String(p.num), x + w - 5, y + 4, { align: 1, color: "#10171E", shadow: false });

  text(fit(p.last, w - 8), x + w / 2, y + 20, { color: COL.ink, shadow: false });

  const ovr = overallOf(p);
  const now = starsOf(ovr), max = starsOf(p.pot);
  const wide = Math.ceil(max) * (GW + TRACK) - TRACK;
  starRow(now, max, Math.round(x + (w - wide) / 2), y + 31);

  // Age, and how close he is to his next rating point.
  const bw = w - 12;
  rect(x + 6, y + h - 14, bw, 4, "#2B3A47");
  rect(x + 6, y + h - 14, bw * clamp(p.xp / xpNeeded(p), 0, 1), 4, COL.good);
  text("AGE " + p.age, x + w / 2, y + h - 8, { color: COL.dim, shadow: false });
}

function drawRoster() {
  rect(0, 0, ARTW, ARTH, COL.night);
  rect(0, 0, ARTW, 24, COL.night2);
  rect(0, 24, ARTW, 1, COL.edge);
  text("ROSTER", 10, 6, { align: -1, scale: 2, color: COL.flood });
  const cards = rosterCards();
  text("YOUR " + (cards.length + 1) + " · TAP A MAN", ARTW - 10, 9,
       { align: 1, color: COL.dim, shadow: false });

  const cols = 5, gap = 5, m = 10;
  const cw = Math.floor((ARTW - m * 2 - gap * (cols - 1)) / cols);
  const ch = Math.min(64, Math.floor((ARTH - 30 - 24 - gap) / 2));
  const top = Math.round(30 + (ARTH - 30 - 24 - (ch * 2 + gap)) / 2);
  cards.forEach((c, i) => {
    const x = m + (i % cols) * (cw + gap), y = top + Math.floor(i / cols) * (ch + gap);
    const id = "man:" + i;
    HOT.push({ id, x, y, w: cw, h: ch });
    drawManCard(c.p, x, y, cw, ch, Input.holdId === id);
  });

  // The defence is a unit, not a set of men, and its card says so.
  const i = cards.length;
  const x = m + (i % cols) * (cw + gap), y = top + Math.floor(i / cols) * (ch + gap);
  panel(x, y, cw, ch, COL.panel, COL.edge);
  rect(x, y, cw, 15, COL.bad);
  text("DEF", x + 5, y + 4, { align: -1, color: "#10171E", shadow: false });
  text("UNIT", x + cw / 2, y + 20, { color: COL.ink, shadow: false });
  const dn = starsOf(LEAGUE.def), dm = starsOf(Math.min(99, LEAGUE.def + 14));
  const dwide = Math.ceil(dm) * (GW + TRACK) - TRACK;
  starRow(dn, dm, Math.round(x + (cw - dwide) / 2), y + 31, COL.bad, "#4A2B2B");
  text("STOPS, NOT SNAPS", x + cw / 2, y + ch - 8, { color: COL.dim, shadow: false });

  button("back", ARTW / 2 - 40, ARTH - 20, 80, 16, "BACK");
}

/* ---- one man, in full ---------------------------------------------- */
function drawPlayer() {
  rect(0, 0, ARTW, ARTH, COL.night);
  const cards = rosterCards();
  const idx = clamp(PICK.man || 0, 0, cards.length - 1);
  const p = cards[idx].p;

  rect(0, 0, ARTW, 24, COL.night2);
  rect(0, 24, ARTW, 1, COL.edge);
  rect(6, 5, 4, 14, posColour(p.pos));
  text(p.pos + " · " + p.first + " " + p.last, 16, 6,
       { align: -1, scale: 2, color: COL.ink });
  text("#" + p.num, ARTW - 10, 9, { align: 1, color: COL.dim, shadow: false });

  // Left: who he is. Right: what he can do.
  const gap = 8, lw = Math.round((ARTW - 20 - gap) * 0.42);
  const lx = 10, rx = lx + lw + gap, rw = ARTW - rx - 10;
  const top = 32, h = Math.min(ARTH - top - 30, 124);
  panel(lx, top, lw, h, COL.night2, COL.edge);
  text("THE MAN", lx + lw / 2, top + 4, { color: COL.flood });
  rect(lx + 6, top + 14, lw - 12, 1, COL.edge);
  const row = (k, v, i, col) => {
    text(k, lx + 8, top + 20 + i * 12, { align: -1, color: COL.dim, shadow: false });
    text(v, lx + lw - 8, top + 20 + i * 12, { align: 1, color: col || COL.ink, shadow: false });
  };
  const ovr = overallOf(p);
  row("AGE", String(p.age) + (p.age <= 22 ? "  ROOKIE" : ""), 0);
  row("SEASONS", String(p.seasons), 1);
  row("XP LEVEL", String(p.lvl), 2);

  text("RATING", lx + lw / 4, top + 62, { color: COL.dim, shadow: false });
  text("CEILING", lx + lw * 0.75, top + 62, { color: COL.dim, shadow: false });
  const now = starsOf(ovr), max = starsOf(p.pot);
  const w1 = Math.ceil(now) * (GW + TRACK) - TRACK;
  starRow(now, now, Math.round(lx + lw / 4 - w1 / 2), top + 72);
  const w2 = Math.ceil(max) * (GW + TRACK) - TRACK;
  starRow(max, max, Math.round(lx + lw * 0.75 - w2 / 2), top + 72, "#8296A3", "#8296A3");
  text(ovr + " / " + p.pot, lx + lw / 2, top + 84, { color: COL.dim, shadow: false });

  // Next rating point.
  const bw = lw - 20;
  text("NEXT POINT", lx + lw / 2, top + 98, { color: COL.dim, shadow: false });
  rect(lx + 10, top + 108, bw, 6, "#2B3A47");
  rect(lx + 10, top + 108, bw * clamp(p.xp / xpNeeded(p), 0, 1), 6, COL.good);

  panel(rx, top, rw, h, COL.night2, COL.edge);
  text("WHAT HE DOES", rx + rw / 2, top + 4, { color: COL.flood });
  rect(rx + 6, top + 14, rw - 12, 1, COL.edge);
  const sheet = SHEET[p.pos] || SHEET.QB;
  sheet.forEach(([label, key], i) => {
    const y = top + 22 + i * Math.floor((h - 30) / sheet.length);
    text(label, rx + 8, y, { align: -1, color: COL.ink, shadow: false });
    const b = rw - 16, v = clamp(p.r[key], 0, 99) / 99;
    rect(rx + 8, y + 10, b, 7, "#22303C");
    rect(rx + 8, y + 10, b * v, 7, v > 0.75 ? COL.good : v > 0.5 ? COL.flood : COL.bad);
    text(String(Math.round(p.r[key])), rx + rw - 10, y, { align: 1, color: COL.dim, shadow: false });
  });

  button("manprev", 10, ARTH - 20, 40, 16, "<");
  button("mannext", 56, ARTH - 20, 40, 16, ">");
  button("back", ARTW / 2 - 40, ARTH - 20, 80, 16, "BACK");
  text("HE IMPROVES BY DOING · THROW TO HIM AND HE GETS BETTER AT CATCHING",
       ARTW / 2, top + h + 4, { color: "#5D707D", shadow: false });
}

function drawGrowth() {
  const g = LEAGUE.lastGrowth;
  rect(0, 0, ARTW, ARTH, COL.night);
  if (!g) { button("back", ARTW / 2 - 40, ARTH - 20, 80, 16, "BACK"); return; }
  const tone = g.won ? COL.good : g.tied ? COL.flood : COL.bad;
  text(g.won ? "WON" : g.tied ? "DREW" : "LOST", 10, 8, { align: -1, scale: 2, color: tone });
  text(g.week + "   " + g.us + " - " + g.them + "   " + g.opp, 10, 28, { align: -1, color: COL.dim });

  // Left: what each man did. Right: what it earned him.
  const lw = Math.round(ARTW * 0.52);
  panel(10, 42, lw, ARTH - 66, COL.night2, COL.edge);
  text("THIS AFTERNOON", 10 + lw / 2, 47, { color: COL.flood });
  const R = LEAGUE.roster;
  const lines = g.stats
    .map(s => ({ man: s.i === 7 ? R.k : R.off[s.i], l: s.line }))
    .filter(x => x.man && (x.l.comp || x.l.rec || x.l.car || x.l.made))
    .slice(0, 8);
  lines.forEach((x, i) => {
    const y = 60 + i * 13;
    text(x.man.pos + " " + x.man.last.slice(0, 8), 18, y, { align: -1, color: COL.ink, shadow: false });
    const l = x.l;
    const bits = [];
    if (l.comp) bits.push(l.comp + "/" + l.att + "  " + Math.round(l.yds) + " YDS");
    else if (l.rec) bits.push(l.rec + " CATCH  " + Math.round(l.yds) + " YDS");
    else if (l.car) bits.push(l.car + " CARRY  " + Math.round(l.yds) + " YDS");
    if (l.made) bits.push(l.made + "/" + l.kicks + " KICKS");
    if (l.td) bits.push(l.td + " TD");
    text(bits.join("   ") || "-", 10 + lw - 8, y, { align: 1, color: COL.dim, shadow: false });
  });

  const rx = 10 + lw + 10, rw = ARTW - rx - 10;
  panel(rx, 42, rw, ARTH - 66, COL.night2, COL.edge);
  text("WHAT IT EARNED", rx + rw / 2, 47, { color: COL.flood });
  if (!g.growth.length) text("NOBODY IMPROVED THIS WEEK", rx + rw / 2, 76, { color: COL.dim });
  g.growth.forEach((gr, i) => {
    const y = 60 + i * 13;
    const who = gr.unit ? gr.unit : gr.who.pos + " " + gr.who.last.slice(0, 8);
    text(who, rx + 8, y, { align: -1, color: COL.ink, shadow: false });
    const what = gr.unit ? "+" + gr.by + " GRADE" : "LEVELLED UP  >  " + gr.to;
    text(what, rx + rw - 8, y, { align: 1, color: COL.good, shadow: false });
  });
  button("hub", ARTW / 2 - 60, ARTH - 20, 120, 16, "CONTINUE", { primary: true });
}

const STAT_NAME = { spd: "SPEED", acc: "BURST", agi: "AGILITY", pow: "POWER", hnd: "HANDS",
                    tkl: "TACKLE", cov: "COVER", blk: "BLOCK", awr: "AWARENESS", grade: "GRADE" };

function drawOffseason() {
  const o = LEAGUE.offseason;
  rect(0, 0, ARTW, ARTH, COL.night);
  if (!o) { button("hub", ARTW / 2 - 40, ARTH - 20, 80, 16, "BACK"); return; }
  text("OFF-SEASON", 8, 6, { align: -1, scale: 2, color: COL.flood });
  const champ = LEAGUE.champion ? teamBy(LEAGUE.champion) : null;
  text(champ ? (LEAGUE.champion === LEAGUE.my ? "YOU WON THE PIXEL BOWL"
                                              : champ.city + " WON THE PIXEL BOWL") : "",
       ARTW - 8, 10, { align: 1, color: LEAGUE.champion === LEAGUE.my ? COL.good : COL.dim });

  // Left: what a year did to the men you already have.
  const lw = 132;
  const rows = o.retired.length + o.aged.length;
  const lh = Math.min(ARTH - 52, Math.max(54, 26 + (rows || 1) * 12));
  panel(8, 26, lw, lh, COL.night2, COL.edge);
  text("A YEAR OLDER", 8 + lw / 2, 31, { color: COL.flood });
  let y = 46;
  o.retired.forEach(r => {
    text(r.pos + " " + r.n.slice(0, 11), 14, y, { align: -1, color: COL.dim, shadow: false });
    text("RETIRED", 8 + lw - 6, y, { align: 1, color: COL.bad, shadow: false });
    y += 12;
  });
  o.aged.forEach(a => {
    const up = a.now > a.was;
    text(a.p.pos + " " + a.p.last.slice(0, 9), 14, y, { align: -1, color: COL.ink, shadow: false });
    text((up ? "+" : "") + (a.now - a.was) + " > " + a.now, 8 + lw - 6, y,
         { align: 1, color: up ? COL.good : COL.bad, shadow: false });
    y += 12;
  });
  if (!o.retired.length && !o.aged.length)
    text("NOBODY CHANGED", 8 + lw / 2, 52, { color: COL.dim });

  // Right: the draft. Every club picks, worst record first, so where you pick
  // is what last season bought you.
  const rx = 8 + lw + 8, rw = ARTW - rx - 8;
  const slot = myDraftSlot();
  const mine = !o.done && o.order[o.at % o.order.length] === LEAGUE.my;
  text("THE DRAFT", rx, 30, { align: -1, color: COL.flood, shadow: false });
  const head = o.done ? "ALL " + DRAFT_PICKS + " PICKS IN"
             : mine ? "PICK " + (o.at + 1) + " OF " + DRAFT_PICKS + "  ·  YOURS"
             : "PICK " + (o.at + 1) + " OF " + DRAFT_PICKS;
  text(head, rx + rw, 30, { align: 1, color: mine ? COL.ink : COL.dim, shadow: false });

  if (!o.done) {
    // Eight cards of what is left — a board other clubs have already been
    // through, if you finished high enough for that to sting.
    const cols = 4, gap = 4;
    const cw = Math.floor((rw - gap * (cols - 1)) / cols), ch = 60;
    o.board.slice(0, 8).forEach((p, i) => {
      const x = rx + (i % cols) * (cw + gap), yy = 42 + Math.floor(i / cols) * (ch + gap);
      if (mine) HOT.push({ id: "draft:" + i, x, y: yy, w: cw, h: ch });
      const hot = Input.holdId === "draft:" + i;
      panel(x, yy, cw, ch, hot ? COL.panelHi : COL.panel, COL.edge);
      rect(x, yy, cw, 2, posColour(p.pos));
      text(p.pos, x + 6, yy + 6, { align: -1, color: posColour(p.pos), shadow: false });
      text("AGE " + p.age, x + cw - 6, yy + 6, { align: 1, color: COL.dim, shadow: false });
      text(p.last.slice(0, 9), x + cw / 2, yy + 18, { color: COL.ink, shadow: false });
      text(String(overallOf(p)), x + 8, yy + 30, { align: -1, scale: 2, color: COL.ink });
      text("CEIL " + p.pot, x + cw - 6, yy + 34, { align: 1, color: COL.flood, shadow: false });
      const room = p.pot - overallOf(p);
      text(room > 18 ? "RAW" : room > 9 ? "PROJECT" : "READY NOW",
           x + cw / 2, yy + 48, { color: COL.dim, shadow: false });
    });
    // Who has gone already. This is the whole point of a draft order: by the
    // time a good club picks, the board has been through seven other hands.
    const gone = o.taken.filter(t => t.ovr);
    const goneY = 42 + 2 * (ch + gap) + 8;
    text(gone.length ? "GONE" : "NOBODY HAS PICKED YET", rx, goneY,
         { align: -1, color: COL.flood, shadow: false });
    gone.slice(-8).forEach((t, i) => {
      const perRow = 4, lead = 34;
      const x = rx + lead + (i % perRow) * Math.floor((rw - lead) / perRow);
      const yy = goneY + Math.floor(i / perRow) * 11;
      const isMe = t.ab === LEAGUE.my;
      text(t.ab + " " + t.pos + " " + t.ovr, x, yy,
           { align: -1, color: isMe ? COL.flood : COL.dim, shadow: false });
    });

    if (mine) {
      button("pass", rx + rw - 90, ARTH - 22, 90, 16, "PASS");
      text("HE TAKES THE JOB OF WHOEVER IS WORST AT IT", rx, ARTH - 18,
           { align: -1, color: "#5D707D", shadow: false });
    } else {
      button("advancedraft", rx + rw - 124, ARTH - 22, 124, 16, "LET THEM PICK", { primary: true });
      const th = slot === 1 ? "ST" : slot === 2 ? "ND" : slot === 3 ? "RD" : "TH";
      text("YOU PICK " + slot + th + " OF " + DRAFT_PICKS + "  ·  LAST SEASON DECIDED THAT",
           rx, ARTH - 18, { align: -1, color: COL.dim, shadow: false });
    }
  } else {
    // The board is gone. Here is where everybody went.
    const cols = 2, cw = Math.floor(rw / cols);
    o.taken.forEach((t, i) => {
      const x = rx + (i % cols) * cw, yy = 44 + Math.floor(i / cols) * 14;
      const isMe = t.ab === LEAGUE.my;
      text(t.pick + ".", x + 4, yy, { align: -1, color: COL.dim, shadow: false });
      text(t.ab, x + 24, yy, { align: -1, color: isMe ? COL.flood : COL.dim, shadow: false });
      text(t.name === "PASSED" ? "PASSED" : t.pos + " " + t.name.slice(0, 9), x + 52, yy,
           { align: -1, color: isMe ? COL.ink : COL.dim, shadow: false });
      if (t.ovr) text(String(t.ovr), x + cw - 10, yy,
                      { align: 1, color: isMe ? COL.ink : COL.dim, shadow: false });
    });
    button("startyear", rx + rw / 2 - 70, ARTH - 24, 140, 18,
           "START YEAR " + (LEAGUE.year + 1), { primary: true });
  }
}

}

  text("SEED " + s.seed.toString(16).toUpperCase(), lx, VIEWTOP + 66, { color: "#4E5F6B" });

  button("again", lx - 66, ARTH - 52, 132, 20, "REMATCH", { primary: true });
  button("menu", lx - 66, ARTH - 28, 132, 18, "MAIN MENU");

  const u = s.stats.us;
  const avgStart = u.drives ? u.startSum / u.drives : 0;
  const rows = [
    ["FIRST DOWNS", u.first],
    ["TOTAL YARDS", Math.round(u.yards)],
    ["PASSING", Math.round(u.pass)],
    ["RUSHING", Math.round(u.rush)],
    ["COMP / ATT", u.comp + "/" + u.att],
    ["TURNOVERS", u.to],
    ["TOUCHDOWNS", u.td],
    ["DRIVES BEGAN", u.drives ? fieldLabel(FIELD.oppGoal - avgStart, true) : "-"],
  ];
  const pw = Math.round(ARTW * 0.38), px0 = Math.round(ARTW * 0.56);
  const ph = rows.length * 12 + 16;
  panel(px0, VIEWTOP + 12, pw, ph, COL.night2, COL.edge);
  text("YOUR GAME", px0 + pw / 2, VIEWTOP + 17, { color: COL.flood });
  rows.forEach((r, i) => {
    const y = VIEWTOP + 30 + i * 12;
    text(r[0], px0 + 10, y, { align: -1, color: COL.dim });
    text(String(r[1]), px0 + pw - 10, y, { align: 1, color: s.my.trim });
  });
}

/* ===================================================================
   INPUT — one pointer, three meanings, decided by what is on screen.
     aiming   drag moves a cursor on the field, release throws
     running  drag is a floating stick
     menus    tap a hit box
   =================================================================== */
const Input = {
  down: false, x: 0, y: 0, sx: 0, sy: 0,
  holdId: null, aim: null, aimFrom: null,
  // `tgt` is where the thumb is asking to go; `steer` is where he is
  // actually going, eased toward it every frame.
  steerX: 0, steerY: 0, tgtX: 0, tgtY: 0, sprint: false,
  tap: null, throwTo: null, tuck: false, snap: false, swiped: false,
};

function toArt(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) / r.width * ARTW,
    y: (e.clientY - r.top) / r.height * ARTH,
  };
}

function onDown(e) {
  e.preventDefault();
  Sound.init();
  const p = toArt(e);
  Input.down = true;
  Input.swiped = false;
  Input.x = Input.sx = p.x;
  Input.y = Input.sy = p.y;
  const hot = hitTest(p.x, p.y);
  Input.holdId = hot ? hot.id : null;
  if (Input.holdId) return;

  const sim = G.play;
  if (SCREEN === "game" && G.st.phase === "presnap") { Input.snap = true; return; }
  if (SCREEN === "game" && G.st.phase === "live" && sim && !sim.over) {
    if (sim.qbHasIt() && !sim.tucked) {
      const qb = sim.P[0];
      Input.aimFrom = { x: qb.x, y: clamp(qb.y + CFG.reachAhead, 0, FIELD.L) };
      Input.aim = { x: Input.aimFrom.x, y: Input.aimFrom.y };
    }
  }
}

function onMove(e) {
  if (!Input.down) return;
  e.preventDefault();
  const p = toArt(e);
  Input.x = p.x; Input.y = p.y;

  // A horizontal drag across the play row pages the book instead of
  // pressing a card — the standard mobile compromise between the two.
  if (SCREEN === "game" && G.st.phase === "playcall" && !Input.swiped) {
    const dx = p.x - Input.sx;
    if (Math.abs(dx) > 26 && Math.abs(dx) > Math.abs(p.y - Input.sy)) {
      const pages = playPages();
      playPage = (playPage + (dx < 0 ? 1 : pages - 1)) % pages;
      Input.swiped = true;
      Input.holdId = null;
      Sound.blip();
      return;
    }
  }

  if (Input.holdId) {
    // Sliding off a button releases it, the way a hardware button would.
    const hot = hitTest(p.x, p.y);
    if (!hot || hot.id !== Input.holdId) Input.holdId = null;
    return;
  }
  const sim = G.play;
  if (SCREEN !== "game" || G.st.phase !== "live" || !sim || sim.over) return;

  if (Input.aim && sim.qbHasIt() && !sim.tucked) {
    // Dragging back from the way you attack pushes the cursor downfield; screen
    // up is across the field either way.
    const dAlong = (driveRight() ? 1 : -1) * (p.x - Input.sx) / PPY * CFG.aimGain;
    const dAcross = -(p.y - Input.sy) / PPY * CFG.aimGain;
    const qb = sim.P[0];
    let ay = clamp(Input.aimFrom.y + dAlong, qb.y - 4, qb.y + CFG.maxThrow);
    let ax = clamp(Input.aimFrom.x + dAcross, 1.5, FIELD.W - 1.5);
    // A target you cannot see is not a target: keep the cursor on screen, on
    // both axes now that the camera pans across the field too.
    const edgeA = fyAtScreen(16), edgeB = fyAtScreen(ARTW - 16);
    ay = clamp(ay, Math.max(0.8, Math.min(edgeA, edgeB)),
                   Math.min(FIELD.L - 0.8, Math.max(edgeA, edgeB)));
    const topFx = FIELD.W - (camY + 12) / PPY;
    const botFx = FIELD.W - (camY + VIEWH - 12) / PPY;
    ax = clamp(ax, Math.max(0.8, botFx), Math.min(FIELD.W - 0.8, topFx));
    Input.aim = { x: ax, y: ay };
    return;
  }
  // Floating stick for the ball carrier, in the same rotated frame. The
  // thumb sets a TARGET; `update` eases the real steer toward it, and how
  // far the stick is pushed decides how hard he goes. A unit vector snapped
  // to wherever the thumb was that frame is what made running feel like
  // flicking a switch.
  const ddx = p.x - Input.sx, ddy = p.y - Input.sy;
  const len = Math.hypot(ddx, ddy);
  if (len < 3) { Input.tgtX = 0; Input.tgtY = 0; Input.sprint = false; return; }
  const mag = clamp((len - 3) / 20, 0.2, 1);
  Input.tgtY = (driveRight() ? ddx : -ddx) / len * mag;   // toward your end zone
  Input.tgtX = -ddy / len * mag;                          // screen up → across
  Input.sprint = len > 26;
}

function onUp(e) {
  if (!Input.down) return;
  e.preventDefault();
  const p = toArt(e);
  const hot = hitTest(p.x, p.y);
  if (Input.holdId && hot && hot.id === Input.holdId && !Input.swiped) Input.tap = Input.holdId;

  const sim = G.play;
  if (!Input.holdId && SCREEN === "game") {
    if (G.st.phase === "live" && sim && !sim.over && Input.aim && sim.qbHasIt() && !sim.tucked) {
      Input.throwTo = { x: Input.aim.x, y: Input.aim.y };
    }
    if (G.st.phase === "kick" && G.st.kick && !G.st.kick.flight) {
      const k = G.st.kick;
      if (k.stage === "power") { k.stage = "aim"; k.aimT = 0; Sound.snap(); }
      else resolveKick(k.aimX, k.power);
    }
  }

  Input.down = false;
  Input.holdId = null;
  Input.aim = null; Input.aimFrom = null;
  Input.tgtX = 0; Input.tgtY = 0;
  Input.steerX = 0; Input.steerY = 0; Input.sprint = false;
}

for (const [ev, fn] of [["pointerdown", onDown], ["pointermove", onMove],
                        ["pointerup", onUp], ["pointercancel", onUp]]) {
  cv.addEventListener(ev, fn, { passive: false });
}
cv.addEventListener("contextmenu", e => e.preventDefault());

/* ===================================================================
   THE LOOP
   =================================================================== */
let SCREEN = "title";
let PICK = { forOpponent: false, mine: null };
G.resultT = 0;
let driveTimer = 0;

function handleTap(id) {
  if (!id) return;
  Sound.blip();

  if (SCREEN === "title") {
    if (id === "season") {
      if (inSeason()) { SCREEN = "hub"; }
      else { PICK = { forOpponent: false, mine: null, season: true }; SCREEN = "teams"; }
    }
    else if (id === "start") { PICK = { forOpponent: false, mine: null }; SCREEN = "teams"; }
    else if (id === "diff") { SETTINGS.diff = (SETTINGS.diff + 1) % DIFFS.length; saveSettings(); }
    else if (id === "qlen") { const o = [2, 3, 5, 8]; SETTINGS.quarter = o[(o.indexOf(SETTINGS.quarter) + 1) % o.length]; saveSettings(); }
    else if (id === "dir") { SETTINGS.driveRight = !SETTINGS.driveRight; fieldKey = ""; saveSettings(); }
    else if (id === "sfx") { SETTINGS.sound = !SETTINGS.sound; Sound.enabled = SETTINGS.sound; saveSettings(); }
    return;
  }

  if (SCREEN === "teams") {
    if (id === "back") { Sound.back(); if (PICK.forOpponent) { PICK.forOpponent = false; } else SCREEN = "title"; return; }
    if (id.startsWith("team:")) {
      const t = teamBy(id.slice(5));
      if (PICK.season) {
        // Picking your club is the whole of starting a career.
        SETTINGS.team = t.ab; saveSettings();
        newSeasonLeague(t.ab);
        SCREEN = "hub";
        return;
      }
      if (!PICK.forOpponent) {
        PICK.mine = t; PICK.forOpponent = true;
        SETTINGS.team = t.ab; saveSettings();
      } else {
        newGame(PICK.mine.ab, t.ab);
        SCREEN = "game";
        updateCamera(0, true);
      }
    }
    return;
  }

  if (SCREEN === "hub") {
    if (id === "kickoff") return kickOffSeasonGame();
    if (id === "watch") { watchPlayoffs(); return; }
    if (id === "roster") { SCREEN = "roster"; return; }
    if (id === "table") { SCREEN = "table"; return; }
    if (id === "offseason") { SCREEN = "offseason"; return; }
    if (id === "quit") { SCREEN = "title"; G.play = null; G.st = null; return; }
    return;
  }
  if (SCREEN === "roster") {
    if (id === "back") { Sound.back(); SCREEN = "hub"; return; }
    if (id.startsWith("man:")) { PICK.man = +id.slice(4); SCREEN = "player"; }
    return;
  }
  if (SCREEN === "player") {
    const n = rosterCards().length;
    if (id === "back") { Sound.back(); SCREEN = "roster"; return; }
    if (id === "manprev") { PICK.man = ((PICK.man || 0) + n - 1) % n; return; }
    if (id === "mannext") { PICK.man = ((PICK.man || 0) + 1) % n; return; }
    return;
  }
  if (SCREEN === "table") {
    if (id === "back") { Sound.back(); SCREEN = "hub"; }
    return;
  }
  if (SCREEN === "growth") { if (id === "hub") SCREEN = "hub"; return; }
  if (SCREEN === "offseason") {
    if (id === "hub") { SCREEN = "hub"; return; }
    if (id === "advancedraft") { runDraft(); saveLeague(); return; }
    if (id === "pass") { passOnDraft(); return; }
    if (id === "startyear") { startNextSeason(); saveLeague(); SCREEN = "hub"; return; }
    if (id.startsWith("draft:")) {
      const pick = LEAGUE.offseason.board[+id.slice(6)];
      if (pick) { signDraftPick(pick); Sound.first(); }
    }
    return;
  }

  const s = G.st;
  if (id.startsWith("play:")) { snapPlay(playById(id.slice(5))); return; }
  if (id.startsWith("audible:")) { reCall(playById(id.slice(8))); return; }
  if (id === "punt") { punt(); return; }
  if (id === "fg") { beginKick("fg"); return; }
  if (id === "xp") { beginTry(false); return; }
  if (id === "two") { beginTry(true); return; }
  if (id === "advance") { driveTimer = 0; advanceTheirDrive(); return; }
  if (id === "again") {
    if (s.season && inSeason()) { SCREEN = "growth"; G.play = null; G.st = null; return; }
    newGame(s.my.ab, s.opp.ab); return;
  }
  if (id === "menu") {
    if (s.season && inSeason()) { SCREEN = "growth"; G.play = null; G.st = null; return; }
    SCREEN = "title"; G.play = null; return;
  }
}

function kickOffSeasonGame() {
  const fx = myFixture();
  if (!fx) return;
  const oppAb = fx[0] === LEAGUE.my ? fx[1] : fx[0];
  newGame(LEAGUE.my, oppAb, {
    myRoster: seasonRoster(), season: true,
    // Your defence grade, expressed on the same scale team strength uses.
    defStr: (LEAGUE.def - 55) / 6,
  });
  SCREEN = "game";
  updateCamera(0, true);
}

// The play simulation wants a roster shaped the way `makeRoster` shapes one.
// Your season men are that shape already; the defensive half is filled in from
// your DEFENCE grade so the same object works for both callers.
function seasonRoster() {
  const R = LEAGUE.roster;
  const rng = makeRNG((LEAGUE.year * 7919 + LEAGUE.week) >>> 0);
  const shell = makeRoster(teamBy(LEAGUE.my), (LEAGUE.def * 131 + LEAGUE.year) >>> 0);
  return { off: R.off, def: shell.def, k: R.k, rng };
}

// A playoff round you are not in still has to be played.
function watchPlayoffs() {
  advancePlayoffs(makeRNG((Date.now() & 0xffff) >>> 0));
  saveLeague();
  if (LEAGUE.phase === "offseason") SCREEN = "offseason";
}

let ANIM = 0;                   // a wall clock for anything that only animates
function update(dt) {
  ANIM += dt;
  // Ease the steer toward the thumb rather than snapping to it. About a
  // sixteenth of a second of lag, which reads as weight rather than delay.
  if (Input.tgtX !== undefined) {
    const k = 1 - Math.pow(0.0001, dt);
    Input.steerX += (Input.tgtX - Input.steerX) * k;
    Input.steerY += (Input.tgtY - Input.steerY) * k;
  }
  if (G.bannerT > 0) G.bannerT -= dt;
  const tap = Input.tap; Input.tap = null;
  handleTap(tap);
  if (SCREEN !== "game" || !G.st) return;
  const s = G.st;

  if (s.phase === "coin") { s.phase = s.poss === "us" ? "playcall" : "defense"; }

  if (s.phase === "presnap" && Input.snap) {
    Input.snap = false;
    noteTendency(s.chosen.kind);
    G.play.snap();
    s.phase = "live";
  }
  Input.snap = false;

  if (s.phase === "live" && G.play) {
    // Fixed timestep: the simulation is only reproducible if it is always
    // advanced by the same amount, whatever the display is doing.
    //
    // The leftover used to be discarded — `acc` was re-seeded from `dt` every
    // frame — which is fine at exactly 60Hz and catastrophic anywhere else. On
    // a 120Hz display `dt` is 0.0083, never reaches the 0.0167 threshold, and
    // the play simply never advances: you snap the ball and nothing moves.
    // Every iPhone Pro has a 120Hz display.
    G.acc = Math.min((G.acc || 0) + dt, H_STEP * 8);
    let steps = 0;
    while (G.acc >= H_STEP && steps < 6 && !G.play.over) {
      const first = steps === 0;
      G.play.step(H_STEP, {
        snap: false,
        steerX: Input.steerX, steerY: Input.steerY, sprint: Input.sprint,
        aiming: !!Input.aim,
        // A one-shot input belongs to the first substep, and must not be
        // thrown away on a frame that was too short to contain one.
        throwTo: first ? Input.throwTo : null,
        tuck: first ? Input.tuck : false,
      });
      if (first) { Input.throwTo = null; Input.tuck = false; }
      G.acc -= H_STEP; steps++;
    }
    if (steps) burnLive(H_STEP * steps * CFG.clockSpeed);
    if (G.play.over) {
      s.phase = "result";
      G.resultT = CFG.deadBall;
      const r = G.play.result;
      say(r.headline, CFG.deadBall - 0.2,
          r.kind === "td" ? "good" : (r.kind.startsWith("int") || r.kind.startsWith("fumble") || r.kind === "safety" || r.kind === "sack") ? "bad" : "flood");
    }
  }

  if (s.phase === "result") {
    if (G.play && FX.freeze <= 0) G.play.settle(dt);
    G.resultT -= dt;
    if (G.resultT <= 0) {
      const r = G.play.result;
      G.play = null;
      const wasTwo = s.tryFor === "us2";
      if (wasTwo) {
        s.tryFor = null;
        finishTry(r.kind === "td", 2);
      } else {
        applyResult(r);
      }
    }
  }

  if (s.phase === "kick") {
    const k = s.kick;
    k.t += dt;
    // Both stages are a line sweeping past a window you have to catch it in.
    // Pulling a distance out of a drag gave you all the time in the world to
    // get it exactly right, which is not a kick.
    if (!k.flight) {
      if (k.stage === "power") {
        const cycle = (k.t * CFG.kickSweep) % 2;
        k.power = 1 - Math.abs(1 - cycle);
      } else {
        k.aimT += dt;
        const cycle = (k.aimT * CFG.kickAimSweep * 2) % 2;
        k.aimX = ((1 - Math.abs(1 - cycle)) * 2 - 1) * CFG.kickAimSpan;
        // The rush only comes once the ball is actually snapped — and if you
        // are still hunting for your line when it arrives, it is blocked.
        for (const pl of k.players)
          if (pl.role === "rush") pl.y = pl.y0 - Math.min(1.6, k.aimT * 0.85);
        if (k.aimT >= CFG.kickAimTime) {
          k.flight = { t: 0, dur: 0.3, good: false, hasLeg: false, landX: 0, blocked: true };
          s.shake = 0.4; Sound.bigHit();
        }
      }
    }

    if (k.flight) {
      k.flight.t += dt;
      if (k.flight.t > k.flight.dur + 0.8) {
        const good = k.flight.good;
        const wasXP = k.kind === "xp";
        s.kick = null;
        if (wasXP) finishTry(good, 1);
        else if (good) {
          if (s.season) { const kk = manLine(7); kk.kicks++; kk.made++; kk.xp += 22; }
          s.us += 3; say("FIELD GOAL IS GOOD", 1.4, "good"); Sound.score();
          if (burn(6)) { if (endOfQuarter()) return; }
          startTheirDrive(FIELD.oppGoal - 25);
        } else {
          say(k.flight.blocked ? "BLOCKED" : "NO GOOD", 1.4, "bad");
          if (burn(6)) { if (endOfQuarter()) return; }
          startTheirDrive(Math.max(FIELD.ownGoal + 20, s.los - 7));
        }
      }
    }
  }

  if (s.phase === "defense") {
    driveTimer += dt;
    if (driveTimer > 1.05) { driveTimer = 0; advanceTheirDrive(); }
  }

  updateCamera(dt, s.phase === "playcall" || s.phase === "defense");
}

let lastDt = 1 / 60;
function draw() {
  HOT = [];
  ctx.fillStyle = COL.night;
  ctx.fillRect(0, 0, ARTW, ARTH);

  if (NEEDS_ROTATE) { drawRotatePrompt(); return; }
  if (SCREEN === "title") { drawTitle(); return; }
  if (SCREEN === "teams") { drawTeams(); return; }
  if (SCREEN === "hub") { drawHub(); return; }
  if (SCREEN === "roster") { drawRoster(); return; }
  if (SCREEN === "player") { drawPlayer(); return; }
  if (SCREEN === "table") { drawTable(); return; }
  if (SCREEN === "growth") { drawGrowth(); return; }
  if (SCREEN === "offseason") { drawOffseason(); return; }
  if (!G.st) return;

  buildField();
  drawField();
  drawLines();
  drawRoutes();
  drawPlayers(lastDt);
  drawAim();
  drawHUD();

  const p = G.st.phase;
  if (p === "playcall") drawPlayCall();
  else if (p === "presnap") drawPresnap();
  else if (p === "live") drawLiveControls();
  else if (p === "try") drawTry();
  else if (p === "kick") drawKick();
  else if (p === "defense") drawDefense();
  else if (p === "final") drawFinal();

  drawBanner();
}

let lastT = 0;
function frame(ts) {
  const dt = lastT ? Math.min(0.1, (ts - lastT) / 1000) : 1 / 60;
  lastT = ts;
  lastDt = dt;
  update(dt);
  draw();
  present();
  requestAnimationFrame(frame);
}

/* ===================================================================
   BOOT
   =================================================================== */
function boot() {
  Sound.enabled = SETTINGS.sound;
  Sound.init();
  resize();
  requestAnimationFrame(frame);
}

document.getElementById("start").addEventListener("click", () => {
  const b = document.getElementById("boot");
  b.classList.add("gone");
  setTimeout(() => b.remove(), 400);
  boot();
});

// Size the canvas immediately so the first paint is not a flash of nothing.
resize();

/* ---- installed, and offline -----------------------------------------
   Served from any https origin, this registers a worker that caches the
   whole game, which is what turns "Add to Home Screen" into an app that
   opens on the underground. Anywhere it cannot register — a file:// copy,
   an embed — it simply does not, and the game is unaffected.
   ------------------------------------------------------------------ */
if (typeof navigator !== "undefined" && "serviceWorker" in navigator
    && typeof window !== "undefined" && window.isSecureContext) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
</body>
