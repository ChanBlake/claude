# Publishes Pixel Bowl to GitHub Pages.
#
# The point of this is the phone: served from https, the game registers a
# service worker, and "Add to Home Screen" in Safari then gives a real
# full-screen app with its own icon that opens with no signal. No developer
# certificate, no seven-day expiry, no Mac.
#
# One thing has to be done by hand, once, because a workflow token is not a
# repository admin and never can be: enabling Pages. Creating a Pages site
# needs admin rights, so `enablement: true` fails with "Resource not
# accessible by integration" no matter what the permissions block says.
#
#   https://github.com/ChanBlake/claude/settings/pages
#   Build and deployment -> Source -> "GitHub Actions"
#
# After that this runs on every push to the branch and needs nothing else.
name: Pages

on:
  push:
    branches:
      - main
      - "claude/pixel-football-ios-game-kmiufs"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp pixelbowl/index.html pixelbowl/manifest.webmanifest pixelbowl/sw.js _site/
          cp pixelbowl/icon-*.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
