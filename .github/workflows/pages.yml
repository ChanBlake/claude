# Publishes Pixel Bowl to GitHub Pages.
#
# The point of this is the phone: served from https, the game registers a
# service worker, and "Add to Home Screen" in Safari then gives a real
# full-screen app with its own icon that opens with no signal. No developer
# certificate, no seven-day expiry, no Mac.
#
# NOT IN USE, and left here on purpose.
#
# Pages is served straight from this branch instead ("Deploy from a branch",
# folder /root), which needs no workflow, no Actions minutes, and no
# github-pages environment that might restrict deploys to a default branch
# this repository does not have. A push republishes the site by itself.
#
# This exists for the day the site needs a build step. It cannot enable Pages
# for itself — creating a Pages site needs repository admin, which a workflow
# token is not, whatever the permissions block below says — so switching to it
# means setting Source to "GitHub Actions" by hand first.
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp pixelbowl/index.html pixelbowl/manifest.webmanifest pixelbowl/sw.js _site/
          cp pixelbowl/icon-*.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
